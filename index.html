<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232253d1'/%3E%3Cpath d='M7 11h18M7 16h18M7 21h12' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Рабочая тетрадь СРС</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: тетрадь в клетку. Бумага с сеткой, чернильно-синий текст, жёлтый маркер только на текущем шаге. */
:root{
  --paper:#f4f7fc; --card:#ffffff; --ink:#132238; --ink2:#4a5b74; --line:#d3dcea; --grid:#e4ebf5;
  --accent:#2253d1; --accent-ink:#ffffff; --hl:#ffe46b; --hl-ink:#3a2f00;
  --ok:#14825a; --ok-bg:#e3f5ec; --bad:#c0372d; --bad-bg:#fbe9e7; --warn:#9a5f00;
  --plot-axis:#6a7a92; --plot-grid:#e1e8f3; --plot-a:#2253d1; --plot-b:#d3501f; --plot-c:#14825a; --plot-fill:rgba(34,83,209,.16);
  --fd:'Unbounded',system-ui,sans-serif;
  --fb:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1626; --card:#162135; --ink:#e7eef9; --ink2:#9fb1cc; --line:#2a3a56; --grid:#15233a;
    --accent:#7ea4ff; --accent-ink:#0a1325; --hl:#f0cd3c; --hl-ink:#241b00;
    --ok:#4cc58c; --ok-bg:#12332a; --bad:#ff8277; --bad-bg:#3a1c1a; --warn:#e3a94d;
    --plot-axis:#8fa1bd; --plot-grid:#22324d; --plot-a:#7ea4ff; --plot-b:#ff9a6b; --plot-c:#4cc58c; --plot-fill:rgba(126,164,255,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1626; --card:#162135; --ink:#e7eef9; --ink2:#9fb1cc; --line:#2a3a56; --grid:#15233a;
  --accent:#7ea4ff; --accent-ink:#0a1325; --hl:#f0cd3c; --hl-ink:#241b00;
  --ok:#4cc58c; --ok-bg:#12332a; --bad:#ff8277; --bad-bg:#3a1c1a; --warn:#e3a94d;
  --plot-axis:#8fa1bd; --plot-grid:#22324d; --plot-a:#7ea4ff; --plot-b:#ff9a6b; --plot-c:#4cc58c; --plot-fill:rgba(126,164,255,.22);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--fb); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,5vw,38px)} h2{font-size:clamp(19px,3.4vw,25px)} h3{font-size:16px}
p{margin:0 0 .7em} a{color:var(--accent)}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.mono{font-family:var(--fm)}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:14px 0 12px}
.brand{font-family:var(--fd);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;display:flex;gap:10px;align-items:center}
.brand i{display:inline-block;width:26px;height:26px;border-radius:6px;background:var(--accent);position:relative}
.brand i::before,.brand i::after{content:"";position:absolute;left:5px;right:5px;height:2px;background:var(--accent-ink);border-radius:2px}
.brand i::before{top:8px;box-shadow:0 5px 0 var(--accent-ink)} .brand i::after{top:18px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:500;font-size:14.5px;border:1px solid transparent}
nav.tabs a:hover{color:var(--ink);border-color:var(--line)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}

/* cards, buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.btn{font:inherit;font-weight:500;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* home */
.hero{padding:22px 0 8px}
.hero p{max-width:62ch;color:var(--ink2);font-size:17px}
.who{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:18px 0}
.vall{margin:14px 0 6px}.vall .vsw{margin:6px 0 4px}
.vsw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.who2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-6px 0 18px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:6px 0 26px}
.how .card{padding:14px 16px}
.how b{display:block;font-family:var(--fd);font-size:13px;margin-bottom:4px}
.sem-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.wc{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s;min-width:0}
.wc:hover{border-color:var(--accent);transform:translateY(-2px)}
.wc .no{font-family:var(--fd);font-size:12px;color:var(--ink2);display:flex;justify-content:space-between}
.wc .tt{font-weight:600;font-size:16.5px;line-height:1.3}
.wc .af{font-size:13px;color:var(--ink2)}
.bar{height:8px;border-radius:5px;background:var(--grid);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.pill{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}

/* work */
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:14px}
.whead{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.goal{max-width:70ch;color:var(--ink2);font-size:16.5px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px}
.stp{flex:1 1 0;min-width:112px;text-align:left;font:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.stp small{font-family:var(--fd);font-size:11px;color:var(--ink2);display:flex;justify-content:space-between}
.stp span{font-weight:500;font-size:14px;line-height:1.25}
.stp.cur{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.stp.cur small{color:var(--hl-ink)}
.stp.done small::after{content:"✓";color:var(--ok);font-weight:700}
.stp.cur.done small::after{color:var(--hl-ink)}
.step{padding:20px}
.step h2{margin-bottom:12px}
.prose{max-width:72ch}
.prose ul,.prose ol{padding-left:1.25em;margin:0 0 .8em}
.prose li{margin:.2em 0}
.fx{font-family:var(--fm);font-size:15px;background:var(--grid);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;overflow-x:auto;white-space:pre}
.tip{border-left:4px solid var(--hl);background:var(--card);padding:8px 12px;margin:10px 0;border-radius:0 8px 8px 0;border:1px solid var(--line);border-left:4px solid var(--hl)}
.tip.warn{border-left-color:var(--warn)}
.ext{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* fields */
.fields{display:grid;gap:14px;margin-top:18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-weight:500;font-size:15px}
.fld .hint{font-size:13px;color:var(--ink2)}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input.num{max-width:170px;font-family:var(--fm)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.fb{font-size:13.5px;font-weight:500}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
input.ok{border-color:var(--ok);background:var(--ok-bg)} input.bad{border-color:var(--bad)}
.unit{color:var(--ink2);font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.chk input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.navbtns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}

/* simulators */
.sim{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;margin:16px 0;display:grid;gap:12px}
.sim>h3{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--fb);font-weight:600}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:14px}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.sl output{font-family:var(--fm);font-size:13.5px;color:var(--accent);font-weight:500}
canvas.pl{width:100%;height:270px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--card);touch-action:pan-y}
canvas.pl.sm{height:200px}
.ro{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.ro div{background:var(--grid);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px}
.ro b{display:block;font-family:var(--fm);font-size:15px;font-weight:500;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tblw{overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.tbl th{font-size:12.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.tbl td.ok{color:var(--ok);font-weight:600}
.dbox summary{cursor:pointer;font-weight:500;font-size:14.5px}
.dbox textarea{font-family:var(--fm);font-size:13.5px;margin-top:8px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.leg i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* report */
pre.rep{white-space:pre-wrap;word-break:break-word;font-family:var(--fm);font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:560px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.res-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.res-g .card{display:flex;flex-direction:column;gap:6px}
ol.bib{padding-left:1.3em} ol.bib li{margin:.5em 0}

@media (max-width:640px){
  .who,.who2{grid-template-columns:1fr}
  canvas.pl{height:230px}
  .step{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* образец отчёта */
details.sample{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0}
details.sample>summary{cursor:pointer;font-weight:600;padding:11px 14px;list-style:none;min-height:44px;display:flex;align-items:center}
details.sample>summary::-webkit-details-marker{display:none}
details.sample[open]>summary{border-bottom:1px solid var(--line)}
details.sample>.tip,details.sample>.prose{margin:12px 14px}
.prose.sm{max-width:none;font-size:15px;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:12px 14px}
.sm-h{font-family:var(--fd);font-weight:600;font-size:15px;margin:0 0 .6em}
.sfig{margin:10px 0 14px}.sfig figcaption{margin-top:6px;font-style:italic}
/* язык, кабинет, телефон */
.meta .pill{white-space:normal}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{font:inherit;font-size:14px;font-weight:500;background:var(--card);color:var(--ink2);border:0;padding:7px 12px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.top .row{gap:10px 14px}
.ok-t{color:var(--ok);font-weight:500}
tr.clk{cursor:pointer} tr.clk:hover td,tr.clk.cur td{background:var(--grid)}
.tt2 td:first-child,.tt2 th:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:150px}
.tt2 td,.tt2 th{text-align:center} .tt2 td:first-child,.tt2 th:first-child{text-align:left}
.tt2 td:last-child{white-space:normal;min-width:90px}
select{min-height:40px}
@media (max-width:640px){
  .btn{min-height:44px;font-size:15.5px}.btn.sm{min-height:40px}
  .stp{min-width:128px;padding:10px 12px}
  .sl input{height:34px}
  .sl input::-webkit-slider-thumb{width:26px;height:26px}
  .sl input::-moz-range-thumb{width:26px;height:26px}
  .top{padding-top:10px}
  nav.tabs{overflow-x:auto;flex-wrap:nowrap;max-width:100%;padding-bottom:2px}
  nav.tabs a{white-space:nowrap;padding:9px 12px}
  .navbtns{position:sticky;bottom:0;z-index:5;background:var(--card);margin:22px -14px -14px;padding:10px 14px max(10px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-radius:0 0 12px 12px}
  .navbtns .btn{flex:1 1 0;justify-content:center}
  .toast{bottom:84px}
  .ro{grid-template-columns:1fr 1fr}
  .goal{font-size:15.5px}
  h1{font-size:23px}
}
</style>
<div id="app"></div><script>
/* ===== язык ===== */
let LANG='ru';
const TR={'📷 В отчёт':'📷 Есепке қосу','График добавлен в отчёт (Word)':'График есепке (Word) қосылды','Слишком много графиков: удалите лишние на последнем шаге':'Графиктер тым көп: соңғы қадамда артығын жойыңыз','Не удалось сохранить график':'Графикті сақтау мүмкін болмады','Звук недоступен в этом браузере':'Бұл браузерде дыбыс жоқ','Каждая строка — одна пара чисел через пробел. Десятичная запятая допустима.':'Әр жол — бір жұп сан, бос орынмен бөлінеді. Үтірмен жазуға болады.','■ Остановить звук':'■ Дыбысты тоқтату'};
const tr=s=>(LANG==='kk'&&TR[s])||s;
/* ===== состояние ===== */
const KEY='srs-workbook-v1';
let S={student:{name:'',group:''},a:{},done:{},chk:{},cur:{}};
function loadState(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(S,o);}}catch(e){}}
let _st=0;function saveState(){clearTimeout(_st);_st=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},150);}
const api={val:id=>S.a[id]||'',put:(id,v)=>{S.a[id]=v;saveState();}};

/* ===== утилиты ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function fmt(v,d=2){if(!isFinite(v))return '—';return Number(v).toLocaleString('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:0});}
function pnum(s){if(typeof s==='number')return s;const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(v)?v:NaN;}
function parsePts(text){
  const out=[];String(text||'').split(/\n/).forEach(l=>{
    const p=l.trim().replace(/,/g,'.').split(/[\s;]+/).map(Number);
    if(p.length>=2&&isFinite(p[0])&&isFinite(p[1]))out.push([p[0],p[1]]);
  });
  return out.sort((a,b)=>a[0]-b[0]);
}
function toast(msg){const t=el(`<div class="toast" role="status">${esc(msg)}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';
const NOTES=['до','до♯','ре','ре♯','ми','фа','фа♯','соль','соль♯','ля','ля♯','си'];
function noteOf(f){
  if(!(f>0))return '—';
  const m=12*Math.log2(f/440)+69, r=Math.round(m), cents=Math.round((m-r)*100);
  const name=NOTES[((r%12)+12)%12]+(Math.floor(r/12)-1);
  return name+(cents===0?'':(cents>0?' +':' −')+Math.abs(cents)+' '+(LANG==='kk'?'цент':'цент'));
}

/* ===== график на canvas ===== */
const PLOTS=new Set();
function nice(range,n){const raw=range/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function tickFmt(v){return String(+v.toPrecision(6)).replace('.',',');}
function Plot(cv,o){
  const ctx=cv.getContext('2d');let W=0,H=0,hov=null;
  const M={l:50,r:14,t:16,b:40};
  const X=x=>M.l+(x-o.x0)/(o.x1-o.x0)*(W-M.l-M.r);
  const Y=y=>H-M.b-(y-o.y0)/(o.y1-o.y0)*(H-M.t-M.b);
  const iX=px=>o.x0+(px-M.l)/(W-M.l-M.r)*(o.x1-o.x0);
  function fit(){const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.max(1,Math.round(W*d));cv.height=Math.max(1,Math.round(H*d));ctx.setTransform(d,0,0,d,0,0);}
  function draw(){
    if(!cv.isConnected)return;
    const r=cv.getBoundingClientRect();if(!r.width)return;
    if(Math.abs(r.width-W)>1||Math.abs(r.height-H)>1||!W)fit();
    const ax=cssv('--plot-axis'),gr=cssv('--plot-grid'),ink=cssv('--ink');
    ctx.clearRect(0,0,W,H);ctx.font='12px '+cssv('--fm');
    const xs=nice(o.x1-o.x0,6),ys=nice(o.y1-o.y0,5);
    ctx.lineWidth=1;ctx.textBaseline='middle';
    for(let x=Math.ceil(o.x0/xs-1e-9)*xs;x<=o.x1+1e-9;x+=xs){
      const px=X(x);ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(px,M.t);ctx.lineTo(px,H-M.b);ctx.stroke();
      ctx.fillStyle=ax;ctx.textAlign='center';ctx.fillText(tickFmt(x),px,H-M.b+13);
    }
    for(let y=Math.ceil(o.y0/ys-1e-9)*ys;y<=o.y1+1e-9;y+=ys){
      const py=Y(y);ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(M.l,py);ctx.lineTo(W-M.r,py);ctx.stroke();

const SIMS={ru:(function(){

/* СРС 1: громкость L(t) = -a(t-t0)^2 + L0 */
SIM.fitQuad=function(root,opt){

/* СРС 6: затухание A(t) = A0 e^{-kt} */

      const den=n*sxx-sx*sx;if(Math.abs(den)>1e-12){const b=(n*sxy-sx*sy)/den,a=(sy-b*sx)/n;if(b<0)est={T:Math.LN2/(-b),A:Math.exp(a)};}}

  const P1=Plot(c1,{x0:0,x1:6,y0:0,y1:100,xl:'t, с',yl:'L, дБ',xu:'с',series:[]});

    const fd=[];for(let i=0;i+1<pts.length;i++){const dt=pts[i+1][0]-pts[i][0];if(dt>0)fd.push([(pts[i][0]+pts[i+1][0])/2,(pts[i+1][1]-pts[i][1])/dt]);}
    const allY=ys.concat(pts.map(p=>p[1])),allD=ds.concat(fd.map(p=>p[1]));
    Object.assign(P1.o,{x1:xmax,y0:Math.floor((Math.min(...allY)-5)/10)*10,y1:Math.ceil((Math.max(...allY)+5)/10)*10,series:[{fn:L,name:'L',color:'--plot-a'},{pts,kind:'dots',color:'--plot-b'}]});

    const ro=readout(s,4);
    const P=Plot(c,{x0:0,x1:5,y0:-1.3,y1:1.3,xl:'t, мс',yl:'y',xu:'мс',series:[]});
    function draw(){
      const T=1000/v.f,r=Math.asin(v.a),t1=r/TAU/v.f*1000,t2=(Math.PI-r)/TAU/v.f*1000;
      const sol=[t1<0?t1+T:t1,t2<0?t2+T:t2].sort((x,y)=>x-y);
      Object.assign(P.o,{x1:2*T,series:[{fn:t=>Math.sin(TAU*v.f*t/1000),name:'y',color:'--plot-a'},{hline:v.a,color:'--plot-b',dash:[6,5],w:1.6},{vline:sol[0],color:'--plot-c',w:1.4},{vline:sol[1],color:'--plot-c',w:1.4}]});

/* СРС 8: интеграл и энергия */
SIM.integral=function(root){
  const {s}=simShell(root,'Симулятор · энергия звука ∫A²(t)dt');
  const sel=el('<label class="small">Огибающая A(t): <select id="sim-int-type"><option value="lin">A = m·t (crescendo)</option><option value="const">A = m (ровный звук)</option><option value="dec">A = 6·e^(−m·t) (затухание)</option><option value="pts">мои точки</option></select></label>');
  s.appendChild(sel);const select=$('select',sel);
  const v=sliders(s,[
    {k:'m',label:'Параметр m',min:.2,max:4,step:.1,v:2,d:1},
    {k:'b',label:'Длительность b, с (для «моих точек» берётся из данных)',min:1,max:6,step:.5,v:3,d:1,u:'с'},
    {k:'n',label:'Число трапеций n',min:1,max:60,step:1,v:6,d:0}],()=>draw());
  const c=canvas(s);
  legend(s,[['--plot-a','A(t)'],['--plot-b','A²(t) и приближение трапециями']]);
  const ro=readout(s,6);
  dataBox(s,'w8.data','0 0\n1 2\n2 4\n3 6','Мои точки огибающей: t (с) и A',()=>draw());
  select.addEventListener('change',draw);
  const P=Plot(c,{x0:0,x1:3,y0:0,y1:40,xl:'t, с',yl:'A, A²',xu:'с',series:[]});
  function interp(pts){return t=>{if(!pts.length)return NaN;if(t<=pts[0][0])return pts[0][1];for(let i=0;i+1<pts.length;i++){if(t<=pts[i+1][0]){const k=(t-pts[i][0])/(pts[i+1][0]-pts[i][0]);return pts[i][1]+k*(pts[i+1][1]-pts[i][1]);}}return pts[pts.length-1][1];};}
  function draw(){
    const type=select.value,pts=parsePts(api.val('w8.data'));
    let A,b=v.b;
    if(type==='lin')A=t=>v.m*t;else if(type==='const')A=t=>v.m;else if(type==='dec')A=t=>6*Math.exp(-v.m*t);
    else{A=interp(pts);b=pts.length?pts[pts.length-1][0]:1;}
    const sq=t=>A(t)*A(t),N=2000;let ex=0,area=0;
    for(let i=0;i<N;i++){const t0=b*i/N,t1=b*(i+1)/N;ex+=(sq(t0)+sq(t1))/2*(b/N);area+=(A(t0)+A(t1))/2*(b/N);}
    const n=Math.round(v.n);let tr=0;const nodes=[];
    for(let i=0;i<=n;i++){const t=b*i/n;nodes.push([t,sq(t)]);if(i>0)tr+=(nodes[i-1][1]+nodes[i][1])/2*(b/n);}
    let ymax=0;for(let i=0;i<=200;i++)ymax=Math.max(ymax,sq(b*i/200));
    Object.assign(P.o,{x0:0,x1:b,y0:0,y1:Math.max(1,ymax*1.1),series:[{pts:nodes,kind:'area',color:'--plot-b',marks:true},{fn:sq,from:0,to:b,name:'A²',color:'--plot-b',w:1.6},{fn:A,from:0,to:b,name:'A',color:'--plot-a'}]});P.draw();
    const mean=area/b;
    const arr=[['Площадь под A(t)',fmt(area,3)],['Энергия E ≈ ∫A² (точно)',fmt(ex,3)+' усл. ед.'],['E по '+n+' трапециям',fmt(tr,3)+' (ошибка '+fmt(ex?Math.abs(tr-ex)/ex*100:0,2)+' %)'],['Ровный звук с той же средней A = '+fmt(mean,2),'E = '+fmt(mean*mean*b,3)]];
    if(type==='lin')arr.push(['Формула для A = m·t','E = m²b³/3 = '+fmt(v.m*v.m*b*b*b/3,3)]);
    ro(arr);
  }
  draw();
};

SIM.golden=function(root,opt){
  const parts=(opt&&opt.parts)||['ratio','table','fib','frets'];
  const PHI=(1+Math.sqrt(5))/2;
  if(parts.includes('ratio')){
    const {s}=simShell(root,'Симулятор · деление отрезка');
    const v=sliders(s,[{k:'x',label:'Положение точки деления (доля длины)',min:.3,max:.8,step:.001,v:.6,d:3}],()=>draw());
    const c=el('<canvas class="pl" style="height:90px"></canvas>');s.appendChild(c);
    const ro=readout(s,4);
    const ctx=c.getContext('2d');
    function draw(){
      const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);
      const W=r.width,x0=16,x1=W-16,xm=x0+(x1-x0)*v.x;ctx.clearRect(0,0,W,r.height);

      const wh=1/v.x,pb=v.x/(1-v.x);
      ro([['Целое / большая часть',fmt(wh,4)],['Большая / меньшая часть',fmt(pb,4)],['φ = (1+√5)/2',fmt(PHI,4)],['Отличие от золотого сечения',fmt(Math.abs(pb-PHI)/PHI*100,2)+' %']]);
    }
    draw();if(window.ResizeObserver)new ResizeObserver(draw).observe(c);
  }
  if(parts.includes('table')){
    const {s}=simShell(root,'Таблица измерений инструмента');

    const out=el('<div class="tblw"></div>');
    dataBox(s,'w9.data','Общая длина и корпус; 590; 355\nКорпус и нижняя дека; 355; 215','Мои измерения',()=>draw());s.appendChild(out);
    function draw(){
      const rows=String(api.val('w9.data')).split('\n').map(l=>l.split(';')).filter(p=>p.length>=3&&pnum(p[1])>0&&pnum(p[2])>0);
      if(!rows.length){out.innerHTML='<div class="muted small">Данных пока нет — добавьте строки выше.</div>';return;}
      out.innerHTML='<table class="tbl"><thead><tr><th>Размер</th><th>целое</th><th>часть</th><th>целое / часть</th><th>отличие от φ, %</th><th>часть / остаток</th><th>отличие от φ, %</th></tr></thead><tbody>'+rows.map(p=>{
        const w=pnum(p[1]),a=pnum(p[2]),r1=w/a,e1=Math.abs(r1-PHI)/PHI*100,rest=w-a,r2=rest>0?a/rest:NaN,e2=rest>0?Math.abs(r2-PHI)/PHI*100:NaN;
        return `<tr><td>${esc(p[0].trim())}</td><td>${fmt(w,1)}</td><td>${fmt(a,1)}</td><td>${fmt(r1,3)}</td><td class="${e1<5?'ok':''}">${fmt(e1,1)}${e1<5?' ✓':''}</td><td>${fmt(r2,3)}</td><td class="${e2<5?'ok':''}">${isFinite(e2)?fmt(e2,1)+(e2<5?' ✓':''):'—'}</td></tr>`;}).join('')+'</tbody></table><div class="small muted">✓ — отличие меньше 5 %. Но близость одного числа не доказывает, что мастер использовал золотое сечение.</div>';
    }

    s.appendChild(el('<div class="small muted mono">F: '+F.slice(0,12).join(', ')+'… · F(13)/F(12) = '+fmt(F[12]/F[11],4)+'</div>'));
  }
  if(parts.includes('frets')){
    const {s}=simShell(root,'Лады гитары: положение по формуле dₙ = L·(1 − 2^(−n/12))');
    const v=sliders(s,[{k:'L',label:'Мензура (длина струны) L, мм',min:300,max:700,step:1,v:650,d:0,u:'мм'}],()=>draw());
    const tb=el('<div class="tblw"></div>');s.appendChild(tb);

/* СРС 10: симметрия */
SIM.symmetry=function(root,opt){
  const parts=(opt&&opt.parts)||['rosette','mirror'];
  if(parts.includes('rosette')){
    const {s}=simShell(root,'Симулятор · поворотная симметрия розетки');
    const v=sliders(s,[{k:'n',label:'Число лепестков n',min:2,max:16,step:1,v:6,d:0},{k:'ang',label:'Угол поворота',min:0,max:360,step:1,v:0,d:0,u:'°'}],()=>draw());
    const mk=el('<label class="row small"><input type="checkbox"> отметить один лепесток (нарушить симметрию)</label>');s.appendChild(mk);
    const c=el('<canvas class="pl" style="height:300px"></canvas>');s.appendChild(c);
    legend(s,[['--plot-axis','исходное положение (контур)'],['--plot-a','после поворота']]);
    const ro=readout(s,4);const ctx=c.getContext('2d');
    function draw(){
      const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;if(!r.width)return;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);
      const W=r.width,H=r.height,R=Math.min(W,H)/2-8,cx=W/2,cy=H/2,n=Math.round(v.n),marked=mk.firstChild.checked;
      ctx.clearRect(0,0,W,H);
      const petals=(rot,fill)=>{for(let i=0;i<n;i++){const a=rot+i*TAU/n-Math.PI/2,big=marked&&i===0;
        ctx.save();ctx.translate(cx+Math.cos(a)*R*.55,cy+Math.sin(a)*R*.55);ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,0,R*(big?.42:.3),R*Math.min(.16,Math.PI*.55/n),0,0,TAU);
        if(fill){ctx.fillStyle=cssv('--plot-a');ctx.globalAlpha=big?.95:.5;ctx.fill();ctx.globalAlpha=1;}else{ctx.strokeStyle=cssv('--plot-axis');ctx.setLineDash([5,4]);ctx.lineWidth=1.4;ctx.stroke();ctx.setLineDash([]);}
        ctx.restore();}};
      petals(0,false);petals(v.ang*Math.PI/180,true);
      ctx.fillStyle=cssv('--ink');ctx.beginPath();ctx.arc(cx,cy,4,0,TAU);ctx.fill();
      const step=360/n,m=v.ang%step,coincide=marked?(v.ang%360===0):(m<.5||step-m<.5);
      ro([['Наименьший поворот 360° / n',fmt(step,2)+'°'],['Порядок поворотной симметрии',marked?'1 (только 360°)':String(n)],['Текущий угол',v.ang+'°'],['Фигура совпала с исходной?',coincide?'да':'нет']]);
    }
    draw();if(window.ResizeObserver)new ResizeObserver(draw).observe(c);
  }
  if(parts.includes('mirror')){
    const {s}=simShell(root,'Проверка осевой симметрии по фотографии');

      P.o.series=[{fn:t=>Math.sin(w*t),color:'--plot-a',w:1.6},{fn:t=>Math.sin(w*t+ph),color:'--plot-c',w:1.6},{fn:t=>Math.sin(w*t)+Math.sin(w*t+ph),name:'қосынды',color:'--plot-b',w:2.6}];
      P.draw();
      const A=2*Math.abs(Math.cos(ph/2));
      ro([['Қосынды амплитудасы 2A·|cos(φ/2)|',fmt(A,3)+' (A = 1 кезінде)'],['Уақыт бойынша ығысу',fmt(v.ph/360*1000/440,3)+' мс'],[A<.05?'Толқындар бір-бірін өшіреді':(A>1.95?'Толқындар бір-бірін күшейтеді':'Ішінара күшею'),'']]);
    }
    draw();
  }
  if(parts.includes('eq')){
    const {s}=simShell(root,'Симулятор · sin(2π·f·t) = a теңдеуі',true);
    const v=sliders(s,[{k:'f',label:'Жиілік f, Гц',min:60,max:1000,step:1,v:440,d:0},{k:'a',label:'a мәні',min:-1,max:1,step:.05,v:.5,d:2}],()=>draw());
    const bar=el('<div class="row"></div>');s.appendChild(bar);
    playBtn(bar,'Тонды тыңдау',()=>Snd.play([{f:v.f,a:1}],2.5,{}));
    const c=canvas(s,'sm');
    legend(s,[['--plot-a','y = sin(2π·f·t)'],['--plot-b','y = a'],['--plot-c','бірінші периодтағы шешімдер']]);
    const ro=readout(s,4);
    const P=Plot(c,{x0:0,x1:5,y0:-1.3,y1:1.3,xl:'t, мс',yl:'y',xu:'мс',series:[]});
    function draw(){
      const T=1000/v.f,r=Math.asin(v.a),t1=r/TAU/v.f*1000,t2=(Math.PI-r)/TAU/v.f*1000;
      const sol=[t1<0?t1+T:t1,t2<0?t2+T:t2].sort((x,y)=>x-y);
      Object.assign(P.o,{x1:2*T,series:[{fn:t=>Math.sin(TAU*v.f*t/1000),name:'y',color:'--plot-a'},{hline:v.a,color:'--plot-b',dash:[6,5],w:1.6},{vline:sol[0],color:'--plot-c',w:1.4},{vline:sol[1],color:'--plot-c',w:1.4}]});
      P.draw();
      ro([['arcsin a',fmt(r,4)+' рад = '+fmt(r*180/Math.PI,2)+'°'],['Бірінші периодтағы шешімдер','t₁ = '+fmt(sol[0],4)+' мс; t₂ = '+fmt(sol[1],4)+' мс'],['Жалпы шешім','t = (arcsin a + 2πk)/(2πf)  немесе  (π − arcsin a + 2πk)/(2πf)'],['Период T',fmt(T,3)+' мс']]);
    }
    draw();
  }
};

/* СРС 8: интеграл и энергия */
SIM.integral=function(root){
  const {s}=simShell(root,'Симулятор · дыбыс энергиясы ∫A²(t)dt');
  const sel=el('<label class="small">A(t) қоршаушысы: <select id="sim-int-type"><option value="lin">A = m·t (crescendo)</option><option value="const">A = m (тегіс дыбыс)</option><option value="dec">A = 6·e^(−m·t) (өшу)</option><option value="pts">менің нүктелерім</option></select></label>');
  s.appendChild(sel);const select=$('select',sel);
  const v=sliders(s,[
    {k:'m',label:'m параметрі',min:.2,max:4,step:.1,v:2,d:1},
    {k:'b',label:'Ұзақтығы b, с («менің нүктелерім» үшін деректерден алынады)',min:1,max:6,step:.5,v:3,d:1,u:'с'},
    {k:'n',label:'Трапециялар саны n',min:1,max:60,step:1,v:6,d:0}],()=>draw());
  const c=canvas(s);
  legend(s,[['--plot-a','A(t)'],['--plot-b','A²(t) және трапециялармен жуықтау']]);
  const ro=readout(s,6);
  dataBox(s,'w8.data','0 0\n1 2\n2 4\n3 6','Менің қоршаушы нүктелерім: t (с) және A',()=>draw());
  select.addEventListener('change',draw);
  const P=Plot(c,{x0:0,x1:3,y0:0,y1:40,xl:'t, с',yl:'A, A²',xu:'с',series:[]});
  function interp(pts){return t=>{if(!pts.length)return NaN;if(t<=pts[0][0])return pts[0][1];for(let i=0;i+1<pts.length;i++){if(t<=pts[i+1][0]){const k=(t-pts[i][0])/(pts[i+1][0]-pts[i][0]);return pts[i][1]+k*(pts[i+1][1]-pts[i][1]);}}return pts[pts.length-1][1];};}
  function draw(){
    const type=select.value,pts=parsePts(api.val('w8.data'));
    let A,b=v.b;
    if(type==='lin')A=t=>v.m*t;else if(type==='const')A=t=>v.m;else if(type==='dec')A=t=>6*Math.exp(-v.m*t);
    else{A=interp(pts);b=pts.length?pts[pts.length-1][0]:1;}
    const sq=t=>A(t)*A(t),N=2000;let ex=0,area=0;
    for(let i=0;i<N;i++){const t0=b*i/N,t1=b*(i+1)/N;ex+=(sq(t0)+sq(t1))/2*(b/N);area+=(A(t0)+A(t1))/2*(b/N);}
    const n=Math.round(v.n);let tr=0;const nodes=[];
    for(let i=0;i<=n;i++){const t=b*i/n;nodes.push([t,sq(t)]);if(i>0)tr+=(nodes[i-1][1]+nodes[i][1])/2*(b/n);}
    let ymax=0;for(let i=0;i<=200;i++)ymax=Math.max(ymax,sq(b*i/200));
    Object.assign(P.o,{x0:0,x1:b,y0:0,y1:Math.max(1,ymax*1.1),series:[{pts:nodes,kind:'area',color:'--plot-b',marks:true},{fn:sq,from:0,to:b,name:'A²',color:'--plot-b',w:1.6},{fn:A,from:0,to:b,name:'A',color:'--plot-a'}]});P.draw();
    const mean=area/b;
    const arr=[['A(t) астындағы аудан',fmt(area,3)],['Энергия E ≈ ∫A² (нақты)',fmt(ex,3)+' шартты бірл.'],['E '+n+' трапеция бойынша',fmt(tr,3)+' (қате '+fmt(ex?Math.abs(tr-ex)/ex*100:0,2)+' %)'],['Орташасы сондай тегіс дыбыс, A = '+fmt(mean,2),'E = '+fmt(mean*mean*b,3)]];
    if(type==='lin')arr.push(['A = m·t үшін формула','E = m²b³/3 = '+fmt(v.m*v.m*b*b*b/3,3)]);
    ro(arr);
  }
  draw();
};

SIM.golden=function(root,opt){
  const parts=(opt&&opt.parts)||['ratio','table','fib','frets'];
  const PHI=(1+Math.sqrt(5))/2;
  if(parts.includes('ratio')){
    const {s}=simShell(root,'Симулятор · кесіндіні бөлу');
    const v=sliders(s,[{k:'x',label:'Бөлу нүктесінің орны (ұзындық үлесі)',min:.3,max:.8,step:.001,v:.6,d:3}],()=>draw());
    const c=el('<canvas class="pl" style="height:90px"></canvas>');s.appendChild(c);
    const ro=readout(s,4);
    const ctx=c.getContext('2d');
    function draw(){
      const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);
      const W=r.width,x0=16,x1=W-16,xm=x0+(x1-x0)*v.x;ctx.clearRect(0,0,W,r.height);
      ctx.fillStyle=cssv('--plot-a');ctx.fillRect(x0,28,xm-x0,22);ctx.fillStyle=cssv('--plot-b');ctx.fillRect(xm,28,x1-xm,22);
      ctx.fillStyle=cssv('--ink');ctx.font='13px '+cssv('--fm');ctx.textAlign='center';ctx.fillText('a = '+fmt(v.x,3),(x0+xm)/2,20);ctx.fillText('b = '+fmt(1-v.x,3),(xm+x1)/2,20);
      const wh=1/v.x,pb=v.x/(1-v.x);
      ro([['Бүтін / үлкен бөлік',fmt(wh,4)],['Үлкен / кіші бөлік',fmt(pb,4)],['φ = (1+√5)/2',fmt(PHI,4)],['Алтын қимадан айырмасы',fmt(Math.abs(pb-PHI)/PHI*100,2)+' %']]);
    }
    draw();if(window.ResizeObserver)new ResizeObserver(draw).observe(c);

    const out=el('<div class="tblw"></div>');
    dataBox(s,'w9.data','Жалпы ұзындық және корпус; 590; 355\nКорпус және төменгі дека; 355; 215','Менің өлшемдерім',()=>draw());s.appendChild(out);
    function draw(){
      const rows=String(api.val('w9.data')).split('\n').map(l=>l.split(';')).filter(p=>p.length>=3&&pnum(p[1])>0&&pnum(p[2])>0);
      if(!rows.length){out.innerHTML='<div class="muted small">Деректер әлі жоқ — жоғарыға жолдар қосыңыз.</div>';return;}
      out.innerHTML='<table class="tbl"><thead><tr><th>Өлшем</th><th>бүтін</th><th>бөлік</th><th>бүтін / бөлік</th><th>φ-ден айырмасы, %</th><th>бөлік / қалдық</th><th>φ-ден айырмасы, %</th></tr></thead><tbody>'+rows.map(p=>{
        const w=pnum(p[1]),a=pnum(p[2]),r1=w/a,e1=Math.abs(r1-PHI)/PHI*100,rest=w-a,r2=rest>0?a/rest:NaN,e2=rest>0?Math.abs(r2-PHI)/PHI*100:NaN;
        return `<tr><td>${esc(p[0].trim())}</td><td>${fmt(w,1)}</td><td>${fmt(a,1)}</td><td>${fmt(r1,3)}</td><td class="${e1<5?'ok':''}">${fmt(e1,1)}${e1<5?' ✓':''}</td><td>${fmt(r2,3)}</td><td class="${e2<5?'ok':''}">${isFinite(e2)?fmt(e2,1)+(e2<5?' ✓':''):'—'}</td></tr>`;}).join('')+'</tbody></table><div class="small muted">✓ — айырмасы 5 %-дан аз. Бірақ бір санның жақындығы шебердің алтын қиманы қолданғанын дәлелдемейді.</div>';
    }

    const P=Plot(c,{x0:1,x1:15,y0:1,y1:2.1,xl:'n',yl:'F(n+1)/F(n)',series:[{hline:PHI,color:'--plot-b',dash:[6,5],w:1.6},{pts,kind:'line',color:'--plot-a',marks:true}]});P.draw();
    s.appendChild(el('<div class="small muted mono">F: '+F.slice(0,12).join(', ')+'… · F(13)/F(12) = '+fmt(F[12]/F[11],4)+'</div>'));
  }

    const v=sliders(s,[{k:'L',label:'Мензура (ішек ұзындығы) L, мм',min:300,max:700,step:1,v:650,d:0,u:'мм'}],()=>draw());
    const tb=el('<div class="tblw"></div>');s.appendChild(tb);

      tb.innerHTML='<table class="tbl"><thead><tr><th>перде n</th><th>жоғарғы тиектен dₙ, мм</th><th>келесіге дейінгі қадам, мм</th></tr></thead><tbody>'+Array.from({length:12},(_, i)=>{const n=i+1,d=v.L*(1-Math.pow(2,-n/12)),d2=v.L*(1-Math.pow(2,-(n+1)/12));return `<tr><td>${n}</td><td>${fmt(d,1)}${n===12?' = L/2':''}</td><td>${fmt(d2-d,1)}</td></tr>`;}).join('')+'</tbody></table>';
    }
    draw();
  }

    function draw(){
      const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;if(!r.width)return;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);

      ro([['Ең кіші бұрылыс 360° / n',fmt(step,2)+'°'],['Бұрылыс симметриясының реті',marked?'1 (тек 360°)':String(n)],['Ағымдағы бұрыш',v.ang+'°'],['Фигура бастапқысымен сәйкес келді ме?',coincide?'иә':'жоқ']]);

  if(parts.includes('mirror')){
    const {s}=simShell(root,'Фотосурет бойынша осьтік симметрияны тексеру');
    s.appendChild(el('<div class="small muted">Аспаптың фотосуретін (алдынан көрінісі) жүктеңіз немесе оқулық суретіне қараңыз. Осьті жылжытып, бір жартысын шағылыстырыңыз: айырмашылықтар бірден көрінеді.</div>'));
    const file=el('<input type="file" accept="image/*" id="sim-mir-file">');s.appendChild(file);
    const sel=el('<label class="small">Режим: <select id="sim-mir-mode"><option value="o">түпнұсқа</option><option value="L">сол жарты оңға шағылысқан</option><option value="R">оң жарты солға шағылысқан</option></select></label>');s.appendChild(sel);

        ctx.fillStyle=cssv('--plot-b');ctx.fillRect(cx-58,372,112,14);

 {t:T3,html:`<p>Включите ровный звук (одну ноту или тон с телефона). Измерьте шумомером уровень на расстоянии 1, 2, 4 и 8 метров от источника по прямой.</p>${tip('В небольшой комнате отражения от стен изменят результат. Это нормально: запишите место измерения и отметьте это в выводах.',1)}`,
  fields:[{id:'pl',type:'text',label:'Где измеряли (зал, класс, улица)'},{id:'d1',type:'num',label:'Уровень на 1 м',unit:'дБ'},{id:'d2',type:'num',label:'Уровень на 2 м',unit:'дБ'},{id:'d4',type:'num',label:'Уровень на 4 м',unit:'дБ'},{id:'d8',type:'num',label:'Уровень на 8 м',unit:'дБ'}]},
 {t:T4,html:`<p>Сравните измерения с теорией, посчитайте искажение и предложите шкалу громкости.</p>`,
  fields:[{id:'df',type:'num',label:'Разность L(1 м) − L(2 м) по вашим измерениям',unit:'дБ'},{id:'th',type:'area',label:'Теория даёт 6 дБ. Совпало ли? Объясните расхождение (отражения, шум, точность телефона).'},{id:'y',type:'num',label:'Значение y = x − x³/3 при x = 0,5',ans:.4583,tol:.001},{id:'st',type:'num',label:'Примем «кажущуюся громкость» N = k·I^0,3 (показатель около 0,3 — по закону Стивенса; уточните в источнике). Во сколько раз изменится N при росте I в 10 раз?',ans:1.995,tol:.02},{id:'sc',type:'area',label:'Творческий проект: предложите свою шкалу громкости. Какая формула, какие значения?'}]}
 ],extra:'Приложите таблицу уровней, график зависимости от расстояния и шкалу громкости.'},

{n:5,sem:1,h:2,after:'Тема 12. Иррациональные уравнения и их системы',title:'Иррациональные уравнения и частота струны',short:'Частота струны',
 goal:'Решить иррациональное уравнение для натяжения струны и построить модель спектра инструмента.',
 steps:[
 {t:T1,html:`<p>Частота основного тона идеальной струны:</p>${fx('f = (1 / 2L) · √(T / μ)')}
 <p>L — длина струны (м), T — натяжение (Н), μ — масса на единицу длины (кг/м). Чтобы найти T по заданной f, решаем <b>иррациональное уравнение</b>:</p>
 ${fx('√(T / μ) = 2Lf   ⇒   T / μ = (2Lf)²   ⇒   T = μ·(2Lf)²')}
 ${tip('ОДЗ: T/μ ≥ 0. Правая часть 2Lf положительна, поэтому после возведения в квадрат посторонних корней не появляется. Но корень всё равно проверяйте подстановкой.')}`,
  fields:[{id:'T',type:'num',label:'Найдите T для L = 0,65 м, f = 329,6 Гц, μ = 0,0004 кг/м',unit:'Н',ans:73.4,tol:.6},{id:'k4',type:'num',label:'Во сколько раз надо увеличить T, чтобы поднять строй на октаву?',ans:4,tol:.01},{id:'f2',type:'num',label:'Какой станет частота, если длину струны уменьшить вдвое (L = 0,325 м)?',unit:'Гц',ans:659.2,tol:1}]},
 {t:T2,html:`<p>Изменяйте L, μ и T. Нажмите «Найти T и подставить» для нужной частоты. Послушайте струну с обертонами.</p>${ext([LNK.phetStr,LNK.unsw])}`,
  sim:[['string',{}]],
  fields:[{id:'o1',type:'area',label:'Как f зависит от T, от μ и от L? Запишите словами (растёт/падает, быстро/медленно).'}]},
 {t:T3,html:`<p>Выберите струнный инструмент (домбра, гитара, скрипка). Измерьте рабочую длину струны линейкой. Частоту возьмите по ноте или тюнером, а массу на метр — из паспорта струны или справочника (укажите источник).</p>`,
  fields:[{id:'ins',type:'text',label:'Инструмент и струна'},{id:'L',type:'num',label:'Длина струны L',unit:'м'},{id:'note',type:'text',label:'Нота струны'},{id:'f',type:'num',label:'Частота струны',unit:'Гц'},{id:'mu',type:'num',label:'Масса на метр μ',unit:'г/м'},{id:'src',type:'text',label:'Откуда взяли μ'}]},
 {t:T4,html:`<p>Решите уравнение для вашей струны. В группе постройте модель спектра: f₁, 2f₁, 3f₁, 4f₁ и сравните с реальной спектрограммой.</p>`,
  fields:[{id:'eq',type:'area',label:'Запишите уравнение со своими числами и решите его по шагам'},{id:'Tr',type:'num',label:'Ответ: натяжение T',unit:'Н'},{id:'chk',type:'area',label:'Проверка корня подстановкой и ОДЗ'},{id:'sm',type:'num',label:'На сколько процентов надо изменить T, чтобы подстроить струну на полтона вверх?',unit:'%',ans:12.2,tol:.3},{id:'spec',type:'area',label:'Групповое задание: частоты пиков реальной спектрограммы вашего инструмента и модель n·f₁. Совпадают?'}]}
 ],extra:'Приложите расчёт, график f(T) и модель спектра.'},

{n:6,sem:1,h:2,after:'Тема 17. Показательные уравнения и их системы',title:'Показательная функция и динамика звука',short:'Затухание звука',
 goal:'Подобрать формулу затухания вашего звука и вычислить, как долго он звучит.',
 steps:[
 {t:T1,html:`<p>Звук после удара или щипка затухает так: через каждые T секунд амплитуда уменьшается вдвое.</p>${fx('A(t) = A₀ · 2^(−t / T)')}
 <ul><li>A₀ — начальная амплитуда, T — время уменьшения вдвое (чем меньше T, тем быстрее спад);</li><li>через t = n·T амплитуда равна A₀ / 2ⁿ: за 3T — в 8 раз меньше, за 4T — в 16 раз;</li><li>«время реверберации» зала — время спада примерно в 1000 раз. Так как 2¹⁰ = 1024 ≈ 1000, это около <b>10·T</b>;</li><li>показательное уравнение решаем приведением к одному основанию: 2^x = 8 = 2³, значит x = 3.</li></ul>`,
  fields:[{id:'n8',type:'num',label:'Через сколько секунд амплитуда упадёт в 8 раз при T = 0,2 с? (2^x = 8)',unit:'с',ans:.6,tol:.01},{id:'n1000',type:'num',label:'Через сколько T амплитуда уменьшится примерно в 1000 раз? Подберите целое n в уравнении 2ⁿ ≈ 1000',ans:10,tol:.01},{id:'T2',type:'num',label:'Найдите T по точкам (0; 5) и (0,6; 0,625). Во сколько раз упала амплитуда? Сколько это раз по T?',unit:'с',ans:.2,tol:.005}]},
 {t:T2,html:`<p>Меняйте T и A₀. Нажмите «Услышать затухание» и сравните T = 0,1 с и T = 1 с.</p>`,
  sim:[['decay',{}]],
  fields:[{id:'o1',type:'area',label:'Как T влияет на график и на звук? Чему равно время «в 1000 раз» (около 10·T) при T = 0,1 с и при T = 1 с?'}]},
 {t:T3,html:`<ol><li>Запишите один удар по клавише рояля, щипок струны или удар по домбре и дайте звуку затухнуть.</li><li>В Audacity найдите самые высокие пики в нескольких моментах t (например, каждые 0,2 с). Амплитуду берите в относительных единицах по вертикальной шкале.</li><li>Впишите пары «t A» в окно ниже. Нажмите «Подставить оценку по точкам».</li></ol>${ext([LNK.audacity])}`,
  sim:[['decay',{}]],
  fields:[{id:'ins',type:'text',label:'Инструмент и нота'},{id:'how',type:'text',label:'Как измеряли амплитуду'}]},
 {t:T4,html:`<p>Используя оценку по точкам, вычислите характеристики вашего звука.</p>`,
  fields:[{id:'tm',type:'num',label:'Ваше T (время уменьшения вдвое)',unit:'с'},{id:'t8',type:'num',label:'Через сколько секунд амплитуда упадёт в 8 раз (3·T)',unit:'с'},{id:'t10',type:'num',label:'Время спада примерно в 1000 раз (10·T)',unit:'с'},{id:'R',type:'num',label:'Простая модель зала: A(r) = A₀·2^(−r/R). Каким должно быть R, чтобы на 20 м амплитуда упала в 8 раз? (20 м = 3·R)',unit:'м',ans:6.667,tol:.02},{id:'cmp',type:'area',label:'Сравните модель и реальные точки. Где они расходятся и почему?'}]}
 ],extra:'Приложите таблицу измерений, график модели с реальными точками и расчёты.'},

{n:7,sem:2,h:3,after:'Тема 5. Применение производной',title:'Производная и изменение громкости музыки',short:'Скорость громкости',
 goal:'Найти, как быстро меняется громкость и в какой момент она достигает максимума, с помощью производной.',
 steps:[
 {t:T1,html:`<p><b>Производная</b> L′(t) — скорость изменения громкости (дБ/с). Правила:</p>${fx("(tⁿ)′ = n·tⁿ⁻¹,   (c·f)′ = c·f′,   (f + g)′ = f′ + g′")}
 <ul><li>L′ > 0 — громкость растёт (crescendo), L′ < 0 — падает (diminuendo);</li><li>L′ = 0 — возможный экстремум; знак меняется «+» на «−» — максимум.</li></ul>
 <p>Пример: L(t) = −t³ + 6t² + 40, 0 ≤ t ≤ 6.</p>`,
  fields:[{id:'d2',type:'num',label:'L′(2) для примера',unit:'дБ/с',ans:12,tol:.01},{id:'tm',type:'num',label:'В какой момент L′ = 0 и громкость максимальна (t > 0)?',unit:'с',ans:4,tol:.01},{id:'lm',type:'num',label:'Максимальная громкость L(4)',unit:'дБ',ans:72,tol:.01}]},
 {t:T2,html:`<p>Задайте формулу ползунками, как в примере (a = −1, b = 6, c = 0, d = 40). Сравните график L(t) и график производной: где L′ = 0, и что в этом месте у L(t)?</p>`,
  sim:[['cubic',{}]],
  fields:[{id:'o1',type:'area',label:'Как связаны нули производной и вершины графика громкости? Как знак производной связан с crescendo?'}]},
 {t:T3,html:`<p>Возьмите данные из СРС №1 или новый фрагмент 10–15 с. Впишите пары «t L» в окно: симулятор покажет приближённую скорость изменения ΔL/Δt. Затем подберите кубическую формулу.</p>`,
  sim:[['cubic',{}]],
  fields:[{id:'piece',type:'text',label:'Фрагмент (произведение, такты)'},{id:'dev',type:'text',label:'Чем измеряли'}]},
 {t:T4,html:`<p>Проанализируйте подобранную функцию.</p>`,
  fields:[{id:'fm',type:'text',label:'Подобранная формула L(t)'},{id:'dr',type:'text',label:'Производная L′(t)'},{id:'cr',type:'area',label:'Решите L′(t) = 0 и найдите точки экстремума с значениями громкости'},{id:'rt',type:'text',label:'Когда громкость нарастает быстрее всего и с какой скоростью'},{id:'mus',type:'area',label:'Сравните с нотным текстом: совпадает ли максимум с кульминацией фразы?'}]}
 ],extra:'Приложите графики L(t) и L′(t), точки экстремума и музыкальный вывод.'},

{n:8,sem:2,h:3,after:'Тема 7. Определённый интеграл',title:'Интегралы для расчёта общей энергии звука',short:'Энергия звука',
 goal:'Рассчитать энергию звука как интеграл и сравнить нарастающий звук с ровным.',
 steps:[
 {t:T1,html:`<p>Энергия звуковой волны пропорциональна интегралу от <b>квадрата</b> амплитуды:</p>${fx('E ~ ∫ A²(t) dt   на промежутке [0; b]')}
 ${tip('Сам сигнал колеблется вокруг нуля, поэтому его интеграл почти ноль. Для «общей интенсивности» берут квадрат амплитуды (или модуль): так площадь не уходит в минус.',1)}
 <p>Формула Ньютона–Лейбница: ∫ₐᵇ f dt = F(b) − F(a). Для t²: F = t³/3.</p>`,
  fields:[{id:'e1',type:'num',label:'∫₀³ (2t)² dt (crescendo A = 2t)',ans:36,tol:.01},{id:'e2',type:'num',label:'∫₀³ 3² dt (ровный звук A = 3)',ans:27,tol:.01},{id:'e3',type:'num',label:'∫₀² sin²(πt) dt',ans:1,tol:.01,hint:'Подсказка: за целое число периодов T среднее значение sin² равно 1/2, значит интеграл равен T/2.'}]},
 {t:T2,html:`<p>Выберите огибающую «A = m·t» и увеличивайте число трапеций n: приближённое значение стремится к точному. Сравните с ровным звуком той же средней амплитуды.</p>`,
  sim:[['integral',{}]],
  fields:[{id:'o1',type:'area',label:'Как ошибка метода трапеций зависит от n? У какого звука энергия больше при той же средней амплитуде и почему?'}]},
 {t:T3,html:`<p>Выберите звук с понятной огибающей: crescendo на одной ноте или затухание ноты. Читайте амплитуду A каждые 0,5 с (в Audacity по вертикальной шкале). Вставьте пары «t A» в окно «Мои точки» и выберите режим «мои точки».</p>`,
  sim:[['integral',{}]],
  fields:[{id:'what',type:'text',label:'Какой звук выбрали и чем измеряли'}]},
 {t:T4,html:`<p>Рассчитайте энергию вашего звука и сравните с ровным.</p>`,
  fields:[{id:'fn',type:'area',label:'Какую функцию A(t) вы взяли (формула или таблица) и почему'},{id:'int',type:'area',label:'Запишите расчёт ∫A² dt: подстановка и вычисление по шагам'},{id:'E',type:'num',label:'Энергия вашего звука',unit:'усл. ед.'},{id:'Ef',type:'num',label:'Энергия ровного звука с той же средней амплитудой',unit:'усл. ед.'},{id:'cmp',type:'area',label:'Какой вывод для музыканта: что даёт больше энергии, нарастание или ровный звук?'}]}
 ],extra:'Приложите график с закрашенной площадью, расчёт и сравнение энергий.'},

{n:9,sem:2,h:3,after:'Тема 14. Многогранники',title:'Золотое сечение в архитектуре музыкальных инструментов',short:'Золотое сечение',
 goal:'Измерить настоящий инструмент и критически проверить, правда ли его пропорции близки к золотому сечению.',
 steps:[
 {t:T1,html:`<p>Отрезок делится <b>золотым сечением</b>, если целое относится к большей части так же, как большая часть к меньшей:</p>${fx('(a + b) / a = a / b = φ,     φ = (1 + √5) / 2 ≈ 1,618')}
 <p>Число φ — положительный корень уравнения x² = x + 1. Отношения соседних чисел Фибоначчи (1, 1, 2, 3, 5, 8, 13…) приближаются к φ. Погрешность: |измерено − φ| / φ · 100 %.</p>`,
  fields:[{id:'phi',type:'num',label:'Значение φ с тремя знаками после запятой',ans:1.618,tol:.001},{id:'fib',type:'num',label:'Отношение 13/8',ans:1.625,tol:.001},{id:'err',type:'num',label:'Погрешность отношения 590/355 относительно φ',unit:'%',ans:2.7,tol:.1}]},
 {t:T2,html:`<p>Найдите положение точки, при котором оба отношения совпадают. Посмотрите, как отношения Фибоначчи сходятся к φ.</p>`,
  sim:[['golden',{parts:['ratio','fib']}]],
  fields:[{id:'x',type:'num',label:'Какая доля длины приходится на большую часть, когда деление золотое? (3 знака)',ans:.618,tol:.002},{id:'o1',type:'area',label:'Что вы заметили на графике Фибоначчи?'}]},
 {t:T3,html:`<ol><li>Выберите инструмент (гитара, скрипка, домбра, клавиатура). В группе распределите инструменты.</li><li>Сфотографируйте его прямо, без наклона, и измерьте линейкой 5–8 размеров (общая длина, длина корпуса, грифа, ширины в разных местах). Точность до 1 мм.</li><li>Впишите размеры в таблицу: «название; целое; часть».</li></ol>`,
  sim:[['golden',{parts:['table']}]],
  fields:[{id:'ins',type:'text',label:'Инструмент'},{id:'tool',type:'text',label:'Чем измеряли, какая точность'}]},
 {t:T4,html:`<p>Проанализируйте таблицу. Для сравнения проверьте закон ладов гитары: он не золотое сечение.</p>`,
  sim:[['golden',{parts:['frets']}]],
  fields:[{id:'best',type:'area',label:'Какие отношения оказались близки к φ (меньше 5 %)?'},{id:'worst',type:'area',label:'Какие далеки от φ? Честно напишите об этом.'},{id:'f12',type:'num',label:'Где находится 12-й лад при L = 650 мм (расстояние от верхнего порожка)?',unit:'мм',ans:325,tol:.5},{id:'cc',type:'area',label:'Можно ли сказать, что мастер использовал золотое сечение? Почему близость одного числа ещё не доказательство?'}]}
 ],extra:'Приложите фото с размерами, таблицу отношений и критический вывод.'},

{n:10,sem:2,h:3,after:'Тема 19. Сфера, шар и их элементы',title:'Симметрия и узоры в дизайне музыкальных инструментов',short:'Симметрия',
 goal:'Найти виды симметрии в настоящих инструментах и создать свой эскиз или макет с продуманной симметрией.',
 steps:[
 {t:T1,html:`<table class="tbl"><thead><tr><th>Вид</th><th>Что это</th><th>Как проверить</th></tr></thead><tbody>
 <tr><td>Осевая</td><td>фигура совпадает с собой при отражении относительно прямой</td><td>согните фото по оси или поставьте зеркало</td></tr>
 <tr><td>Центральная</td><td>совпадает с собой при повороте на 180°</td><td>переверните рисунок вверх ногами</td></tr>
 <tr><td>Поворотная</td><td>совпадает при повороте на 360°/n</td><td>найдите наименьший угол поворота</td></tr></tbody></table>
 <p>Число n — <b>порядок</b> поворотной симметрии.</p>`,
  fields:[{id:'n6',type:'num',label:'Наименьший угол поворота фигуры с порядком n = 6',unit:'°',ans:60,tol:.1},{id:'n8',type:'num',label:'Наименьший угол поворота розетки с 8 одинаковыми лепестками',unit:'°',ans:45,tol:.1},{id:'sq',type:'num',label:'Наименьший угол поворота правильного квадрата',unit:'°',ans:90,tol:.1}]},
 {t:T2,html:`<p>Меняйте число лепестков и угол. Включите «отметить один лепесток» и посмотрите, как меняется порядок симметрии.</p>`,
  sim:[['symmetry',{parts:['rosette']}]],
  fields:[{id:'o1',type:'area',label:'Когда фигура совпадает с собой при повороте? Что происходит с порядком симметрии, если один лепесток отличается?'}]},
 {t:T3,html:`<p>Сфотографируйте инструмент спереди (или возьмите учебный рисунок). Подвиньте ось и отразите половину: найдите, какие детали симметричны, а какие нет.</p>`,
  sim:[['symmetry',{parts:['mirror']}]],

`<p class="sm-h">СРС № 1. Анализ функции, описывающей громкость звука</p>
<p><b>Студент:</b> Иванова А., группа 1-А. <b>Цель:</b> описать громкость фрагмента функцией и найти её свойства.</p>
<p><b>1. Данные.</b> Фрагмент: фортепиано, 6 с, нарастание и спад. Измерено шумомером в телефоне (приложение указать).</p>

<p>Проверка: L(0) = −1,5·9 + 74 = 60,5 дБ (измерено 60), L(2) = 72,5 дБ (измерено 73). Расхождение до 1 дБ: приемлемо для телефона.</p><div class="sgraph" data-g="1a" data-cap="Рис. 1. Измеренные точки (●) и модель L(t) = −1,5(t − 3)² + 74."></div>

<p><b>4. Вывод.</b> Громкость достигает максимума в середине фрагмента: так и написано в нотах (crescendo до кульминации, затем diminuendo). Парабола подходит, потому что звук нарастает и спадает симметрично. Ограничение: у реального звука есть шумы, поэтому точки лежат рядом с кривой, а не на ней.</p>

`<p class="sm-h">СРС № 2. Тригонометрические функции в музыкальной акустике</p>
<p><b>Цель:</b> описать ноту синусоидой и разложить звук скрипки на основной тон и обертоны.</p>
<p><b>1. Теория.</b> Чистый тон: y = A·sin(2πft). Для ноты ля¹ f = 440 Гц, период:</p><div class="fx">T = 1/f = 1/440 ≈ 0,00227 с = 2,27 мс</div>
<p><b>2. Измерение.</b> Записана нота ля¹ на скрипке (4 с) в Audacity, построен спектр. Пики:</p>
<div class="tblw"><table class="tbl"><thead><tr><th></th><th>f₁</th><th>2f₁</th><th>3f₁</th></tr></thead><tbody><tr><td>измерено, Гц</td><td>440</td><td>881</td><td>1319</td></tr><tr><td>по теории, Гц</td><td>440</td><td>880</td><td>1320</td></tr><tr><td>относит. высота</td><td>1</td><td>0,5</td><td>0,3</td></tr></tbody></table></div><div class="sgraph" data-g="2a" data-cap="Рис. 2. Спектр ноты ля¹ (скрипка): пики на f₁, 2f₁, 3f₁ (условные единицы)."></div>
<p><b>3. Модель.</b> y = sin(2π·440t) + 0,5·sin(2π·880t) + 0,3·sin(2π·1320t). В симуляторе звук модели похож на скрипку, но беднее: в реальном звуке есть ещё высокие обертоны и шум смычка.</p><div class="sgraph" data-g="2b" data-cap="Рис. 3. Модель: сумма трёх гармоник (синяя) и чистый синус 440 Гц (оранжевая), первые 10 мс."></div>
<p><b>4. Креативное задание.</b> Вибрато: f(t) = 440 + 6·sin(2π·6·t). Первая «6» — на сколько герц отклоняется высота (±6 Гц), вторая — сколько раз в секунду (6 Гц).</p>
<p><b>5. Вывод.</b> Частоты пиков с точностью до 1 Гц совпали с f₁, 2f₁, 3f₁. Тембр определяется набором и громкостью гармоник, а не только частотой основного тона.</p>
<p class="muted small"><b>Приложение:</b> спектр (скриншот), график модели. <b>Источники:</b> учебник; Audacity; PhET «Фурье — построение волн».</p>`,

`<p class="sm-h">СРС № 3. Тригонометрические уравнения и настройка инструментов</p>
<p><b>Цель:</b> объяснить биения двух струн и решить уравнение sin x = a в задаче о частоте.</p>
<p><b>1. Измерение.</b> Две струны «ля»: по тюнеру f₁ = 440 Гц, f₂ = 443 Гц. На записи за 5 с насчитано 15 биений, то есть 3 биения в секунду.</p>
<div class="fx">|f₁ − f₂| = |440 − 443| = 3 Гц   → 3 биения/с (совпало с измерением)</div>
<p><b>2. Моменты «тишины».</b> Огибающая 2·|cos(π(f₁−f₂)t)| = 0 при:</p><div class="fx">cos(3πt) = 0   ⇒   3πt = π/2 + πk   ⇒   t = (1 + 2k)/6 с = 0,167; 0,5; 0,833 с</div><div class="sgraph" data-g="3a" data-cap="Рис. 4. Огибающая биений 2·|cos(3πt)|; вертикальные линии — моменты «тишины» 0,167; 0,5; 0,833 с."></div>
<p><b>3. Уравнение для f = 440 Гц.</b> sin(2π·440·t) = 1/2:</p>
<div class="fx">2π·440·t = π/6 + 2πk   или   5π/6 + 2πk
t = (1 + 12k)/5280 с   или   t = (5 + 12k)/5280 с
В первом периоде: t₁ ≈ 0,189 мс, t₂ ≈ 0,947 мс (T = 2,27 мс)</div>
<p><b>4. Вывод.</b> Число биений равно разности частот. Настройщик подтягивает вторую струну: разность уменьшается, биения замедляются и исчезают, когда f₁ = f₂. Фазовый сдвиг 180° даёт полное гашение (2cos(φ/2) = 0).</p>
<p class="muted small"><b>Приложение:</b> график суммы двух волн с отмеченными моментами тишины. <b>Источники:</b> учебник (тема «Простейшие тригонометрические уравнения»); Music Acoustics UNSW.</p>`,

`<p class="sm-h">СРС № 4. Степенные функции и звуковые эффекты</p>
<p><b>Цель:</b> проверить, как громкость зависит от расстояния, и описать искажение степенной функцией.</p>
<p><b>1. Теория.</b> p ~ r⁻¹, I ~ r⁻². Правило: каждое удвоение расстояния даёт примерно −6 дБ.</p>
<p><b>2. Измерение.</b> Зал, ровный тон из динамика, телефон-шумомер, по прямой:</p>
<div class="tblw"><table class="tbl"><thead><tr><th>r, м</th><th>1</th><th>2</th><th>4</th><th>8</th></tr></thead><tbody><tr><td>L измерено, дБ</td><td>78</td><td>72</td><td>66</td><td>60,5</td></tr><tr><td>L по теории, дБ</td><td>78</td><td>72</td><td>66</td><td>60</td></tr></tbody></table></div>
<p>L(1) − L(2) = 6 дБ: совпадает с теорией. На 8 м есть отражения от стен, поэтому +0,5 дБ.</p>
<p><b>3. Искажение.</b> y = x − x³/3. При x = 0,5: y = 0,5 − 0,125/3 = 0,4583. Выход меньше входа на 8,3 %, пик «срезан». Чем больше амплитуда, тем сильнее срез, и звук становится «грязнее» (появляются обертоны).</p><div class="sgraph" data-g="4b" data-cap="Рис. 6. Искажение: y = x − x³/3 (синяя) и идеальный выход y = x (пунктир); точка при x = 0,5."></div>
<p><b>4. Шкала громкости.</b> Кажущаяся громкость N = k·I^0,3: при росте I в 10 раз N растёт в 10^0,3 ≈ 2,0 раза. Для уха десятикратный рост энергии звучит как удвоение громкости.</p>
<p><b>5. Вывод.</b> Модель 1/r² подходит в большом пространстве; в маленьком классе её нарушают отражения. Степенная функция удобна: показатель сразу говорит, как быстро идёт спад.</p>
<p class="muted small"><b>Приложение:</b> таблица, график. <b>Источники:</b> учебник; закон Стивенса (указать источник).</p>`,

`<p class="sm-h">СРС № 5. Иррациональные уравнения и частота струны</p>
<p><b>Цель:</b> найти натяжение струны решением иррационального уравнения.</p>
<p><b>1. Данные.</b> Гитара, струна ми¹: L = 0,65 м, f = 329,6 Гц, μ = 0,4 г/м = 0,0004 кг/м (по паспорту струны).</p>
<p><b>2. Решение.</b></p>
<div class="fx">f = (1/2L)·√(T/μ)  ⇒  √(T/μ) = 2Lf = 2·0,65·329,6 = 428,5
T/μ = 428,5² = 183 600  ⇒  T = 0,0004 · 183 600 ≈ 73,4 Н</div>
<p><b>Проверка.</b> ОДЗ: T/μ ≥ 0, правая часть 428,5 > 0. Подстановка: (1/1,3)·√(73,4/0,0004) = 0,769·428,4 ≈ 329,5 Гц ✓.</p>
<p><b>3. Исследование.</b> Чтобы поднять строй на октаву (f×2), T надо увеличить в 4 раза. Полтона вверх: f×2^(1/12), значит T×2^(1/6) ≈ ×1,122, то есть на 12,2 %. Если укоротить струну вдвое (прижать на 12-м ладу): f = 659,2 Гц.</p><div class="sgraph" data-g="5a" data-cap="Рис. 7. Частота струны f(T) при L = 0,65 м, μ = 0,4 г/м. Точка: T = 73,4 Н, f = 329,6 Гц."></div>
<p><b>4. Модель спектра.</b> f₁ = 329,6; 2f₁ = 659,2; 3f₁ = 988,8; 4f₁ = 1318,4 Гц. Пики спектрограммы совпали с n·f₁ с точностью около 1 %.</p>
<p><b>5. Вывод.</b> Частота пропорциональна √T и обратно пропорциональна L. Чтобы струна не рвалась, при подтяжке изменяют T на проценты, а не на единицы ньютонов.</p>
<p class="muted small"><b>Приложение:</b> график f(T). <b>Источники:</b> учебник (иррациональные уравнения); паспорт струн (производитель).</p>`,

`<p class="sm-h">СРС № 6. Показательная функция и динамика звука</p>
<p><b>Цель:</b> описать затухание звука формулой A(t) = A₀·2^(−t/T).</p>
<p><b>1. Измерение.</b> Удар по клавише рояля (нота ля¹), амплитуда в относительных единицах по Audacity:</p>
<div class="tblw"><table class="tbl"><thead><tr><th>t, с</th><th>0</th><th>0,2</th><th>0,4</th><th>0,6</th></tr></thead><tbody><tr><td>A</td><td>5,0</td><td>2,6</td><td>1,3</td><td>0,7</td></tr></tbody></table></div>
<p><b>2. Расчёт T.</b> За 0,2 с амплитуда падает примерно вдвое (5,0 → 2,6), за 0,4 с — примерно в 4 раза (5,0 → 1,3 ≈ 5/4). Значит, T ≈ 0,2 с. Симулятор по четырём точкам даёт T ≈ 0,21 с, A₀ ≈ 4,98. Принимаем T = 0,2 с.</p>
<p><b>3. Характеристики.</b></p>
<div class="fx">A(t) = 5·2^(−t/0,2) = 5·2^(−5t)
спад в 8 раз: 2^x = 8 = 2³, x = 3, t = 3·T = 0,6 с
спад в 1000 раз: 2¹⁰ = 1024 ≈ 1000, t ≈ 10·T = 2 с</div>
<p>Проверка: A(0,6) = 5/2³ = 0,625, измерено 0,7 ✓.</p><div class="sgraph" data-g="6a" data-cap="Рис. 8. Измеренные амплитуды (●) и модель A(t) = 5·2^(−5t)."></div>
<p><b>4. Модель зала.</b> A(r) = A₀·2^(−r/R). Спад в 8 раз на 20 м: 20 = 3·R, R = 20/3 ≈ 6,7 м.</p>
<p><b>5. Вывод.</b> Звук фортепиано затухает по показательному закону: амплитуда уменьшается вдвое каждые 0,2 с. «Время реверберации» зала — это тот же параметр T, только измеренный в зале.</p>
<p class="muted small"><b>Приложение:</b> график модели с точками. <b>Источники:</b> учебник (тема «Показательные уравнения»); Audacity.</p>`,

`<p class="sm-h">СРС № 7. Производная и изменение громкости музыки</p>
<p><b>Цель:</b> найти с помощью производной, когда громкость максимальна и когда она растёт быстрее всего.</p>
<p><b>1. Модель.</b> По измерениям фрагмента (0–6 с) подобрана функция:</p><div class="fx">L(t) = −0,5t³ + 3t² + 50,   0 ≤ t ≤ 6   (L в дБ)</div>
<p><b>2. Производная.</b></p><div class="fx">L′(t) = −1,5t² + 6t = 1,5t·(4 − t)</div>
<p><b>3. Экстремум.</b> L′ = 0 при t = 0 и t = 4. На (0; 4) L′ &gt; 0 (громкость растёт, crescendo), на (4; 6) L′ &lt; 0 (спад, diminuendo). В точке t = 4 знак меняется «+» на «−», значит максимум:</p><div class="fx">L(4) = −0,5·64 + 3·16 + 50 = 66 дБ</div><div class="sgraph" data-g="7a" data-cap="Рис. 9. Громкость L(t) = −0,5t³ + 3t² + 50: максимум 66 дБ при t = 4 с."></div><div class="sgraph" data-g="7b" data-cap="Рис. 10. Производная L′(t) = −1,5t² + 6t: нуль при t = 4 (максимум L), наибольшее значение 6 дБ/с при t = 2."></div>
<p><b>4. Быстрее всего растёт</b> там, где L′ наибольшая: L″ = −3t + 6 = 0 ⇒ t = 2 с, скорость L′(2) = −6 + 12 = 6 дБ/с.</p>
<p><b>5. Вывод.</b> Кульминация фразы приходится на t = 4 с: так и записано в нотах (такт 3, fortissimo). Крутой подъём в начале (6 дБ/с) звучит как резкое вступление, а затем нарастание замедляется перед вершиной.</p>
<p class="muted small"><b>Приложение:</b> графики L(t) и L′(t). <b>Источники:</b> учебник (применение производной); ноты (название, такты).</p>`,

`<p class="sm-h">СРС № 8. Интегралы для расчёта общей энергии звука</p>
<p><b>Цель:</b> сравнить энергию нарастающего звука и ровного звука.</p>
<p><b>1. Модель.</b> Crescendo на одной ноте за 3 с: A(t) = 2t (от 0 до 6). Ровный звук той же средней амплитуды: A = 3 (среднее значение 2t на [0; 3] равно 3).</p>
<p><b>2. Расчёт</b> E ~ ∫A² dt:</p>
<div class="fx">E₁ = ∫₀³ (2t)² dt = 4·t³/3 |₀³ = 4·27/3 = 36
E₂ = ∫₀³ 3² dt = 9·3 = 27</div><div class="sgraph" data-g="8a" data-cap="Рис. 11. Площадь под A²(t) = 4t² на [0; 3] (закрашена) даёт E₁ = 36; пунктир — ровный звук A² = 9, E₂ = 27."></div>
<p><b>3. Проверка методом трапеций</b> (n = 6, h = 0,5) для E₁: 0,5·(0/2 + 1 + 4 + 9 + 16 + 25 + 36/2) = 36,5. Ошибка 1,4 %; при увеличении n ошибка уменьшается.</p>
<p><b>4. Вывод.</b> При одинаковой средней амплитуде у нарастающего звука энергия на 33 % больше (36 против 27), потому что амплитуду возводят в квадрат: большие значения в конце «весят» больше. Для музыканта это значит, что громкая кульминация даёт большую часть энергии фразы.</p>
<p class="muted small"><b>Приложение:</b> график с закрашенной площадью. <b>Источники:</b> учебник (определённый интеграл, формула Ньютона–Лейбница).</p>`,

`<p class="sm-h">СРС № 9. Золотое сечение в архитектуре музыкальных инструментов</p>
<p><b>Цель:</b> проверить, насколько пропорции акустической гитары близки к золотому сечению φ = (1 + √5)/2 ≈ 1,618.</p>
<p><b>1. Измерения</b> (линейка, точность 1 мм; условные данные для образца):</p>
<div class="tblw"><table class="tbl"><thead><tr><th>Размер</th><th>целое, мм</th><th>часть, мм</th><th>целое / часть</th><th>отличие от φ</th></tr></thead><tbody>
<tr><td>Общая длина и длинная часть</td><td>1000</td><td>620</td><td>1,613</td><td>−0,3 %</td></tr>
<tr><td>Длинная часть и короткая</td><td>620</td><td>380</td><td>1,632</td><td>+0,8 %</td></tr>
<tr><td>Длина и ширина корпуса</td><td>480</td><td>310</td><td>1,548</td><td>−4,3 %</td></tr>
<tr><td>Нижняя и верхняя части корпуса</td><td>360</td><td>270</td><td>1,333</td><td>−17,6 %</td></tr></tbody></table></div><div class="sgraph" data-g="9a" data-cap="Рис. 12. Отличие отношений от φ, %. Пунктир — граница ±5 %."></div>
<p><b>2. Анализ.</b> Близки к φ (меньше 5 %) три отношения из четырёх. Четвёртое (корпус) далеко: 17,6 %.</p>
<p><b>3. Проверка.</b> Лады устроены не по золотому сечению: d₁₂ = 650·(1 − 2^(−12/12)) = 325 мм, ровно половина мензуры.</p>
<p><b>4. Вывод.</b> Часть размеров действительно близка к φ, но три совпадения из измеренных нескольких нельзя считать доказательством: размеры можно выбирать так, чтобы они подходили. Мастер мог использовать золотое сечение, а мог просто подбирать «красивые» пропорции на глаз. Для строгого вывода нужно измерить много инструментов.</p>

`<p class="sm-h">СӨЖ № 1. Дыбыс қаттылығын сипаттайтын функцияны талдау</p>
<p><b>Студент:</b> Иванова А., 1-А тобы. <b>Мақсаты:</b> үзіндінің қаттылығын функциямен сипаттап, оның қасиеттерін табу.</p>
<p><b>1. Деректер.</b> Үзінді: фортепиано, 6 с, күшею және бәсеңдеу. Телефондағы шу өлшегішпен өлшенді (қосымшаны атаңыз).</p>
<div class="tblw"><table class="tbl"><thead><tr><th>t, с</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr></thead><tbody><tr><td>L, дБ</td><td>60</td><td>68</td><td>73</td><td>74</td><td>72</td><td>67</td><td>61</td></tr></tbody></table></div><div class="sgraph" data-g="4a" data-cap="5-сурет. Қаттылық деңгейі: өлшемдер (●) және L = 78 − 20·lg r теориясы."></div>
<p><b>2. Модель.</b> Төбесі (3; 74) нүктесінде болатын парабола таңдалды:</p><div class="fx">L(t) = −1,5(t − 3)² + 74,   0 ≤ t ≤ 6</div>
<p>Тексеру: L(0) = −1,5·9 + 74 = 60,5 дБ (өлшенгені 60), L(2) = 72,5 дБ (өлшенгені 73). Айырмашылық 1 дБ-ге дейін: телефон үшін қолайлы.</p><div class="sgraph" data-g="1a" data-cap="1-сурет. Өлшенген нүктелер (●) және L(t) = −1,5(t − 3)² + 74 моделі."></div>
<p><b>3. Қасиеттері.</b> Анықталу облысы [0; 6]. Мәндер жиыны [60,5; 74]. [0; 3] аралығында өседі, [3; 6] аралығында кемиді. Максимум t = 3 с кезінде 74 дБ.</p>
<p><b>4. Қорытынды.</b> Қаттылық үзіндінің ортасында максимумға жетеді: нотада да осылай жазылған (кульминацияға дейін crescendo, содан кейін diminuendo). Дыбыс симметриялы өсіп, кемитіндіктен парабола сәйкес келеді. Шектеу: нақты дыбыста шу бар, сондықтан нүктелер қисықтың үстінде емес, жанында жатады.</p>
<p class="muted small"><b>Қосымша:</b> нүктелері мен параболасы бар график (симулятор скриншоты). <b>Дереккөздер:</b> алгебра оқулығы («Функция қасиеттері» тақырыбы), шу өлшегіш қосымша (атауы).</p>`,

`<p class="sm-h">СӨЖ № 2. Музыкалық акустикадағы тригонометриялық функциялар</p>
<p><b>Мақсаты:</b> нотаны синусоидамен сипаттап, скрипка дыбысын негізгі тон мен обертондарға жіктеу.</p>
<p><b>1. Теория.</b> Таза тон: y = A·sin(2πft). Ля¹ нотасы үшін f = 440 Гц, период:</p><div class="fx">T = 1/f = 1/440 ≈ 0,00227 с = 2,27 мс</div>
<p><b>2. Өлшеу.</b> Скрипкада ля¹ нотасы (4 с) Audacity-ге жазылды, спектр салынды. Шыңдар:</p>
<div class="tblw"><table class="tbl"><thead><tr><th></th><th>f₁</th><th>2f₁</th><th>3f₁</th></tr></thead><tbody><tr><td>өлшенгені, Гц</td><td>440</td><td>881</td><td>1319</td></tr><tr><td>теория бойынша, Гц</td><td>440</td><td>880</td><td>1320</td></tr><tr><td>салыстырмалы биіктігі</td><td>1</td><td>0,5</td><td>0,3</td></tr></tbody></table></div><div class="sgraph" data-g="2a" data-cap="2-сурет. Ля¹ нотасының спектрі (скрипка): f₁, 2f₁, 3f₁ шыңдары (шартты бірлік)."></div>
<p><b>3. Модель.</b> y = sin(2π·440t) + 0,5·sin(2π·880t) + 0,3·sin(2π·1320t). Симуляторда модель дыбысы скрипкаға ұқсайды, бірақ кедейлеу: нақты дыбыста жоғары обертондар мен сыздың шуы да бар.</p><div class="sgraph" data-g="2b" data-cap="3-сурет. Модель: үш гармоника қосындысы (көк) және таза 440 Гц синус (қызғылт сары), алғашқы 10 мс."></div>
<p><b>4. Шығармашылық тапсырма.</b> Вибрато: f(t) = 440 + 6·sin(2π·6·t). Бірінші «6» — биіктік қанша герцке ауытқиды (±6 Гц), екінші — секундына неше рет (6 Гц).</p>

<p class="muted small"><b>Қосымша:</b> спектр (скриншот), модель графигі. <b>Дереккөздер:</b> оқулық; Audacity; PhET «Фурье — толқын құру».</p>`,

<p><b>Мақсаты:</b> екі ішектің соғуын түсіндіру және жиілік есебінде sin x = a теңдеуін шешу.</p>

`<p class="sm-h">СӨЖ № 7. Туынды және музыка қаттылығының өзгеруі</p>
<p><b>Мақсаты:</b> туындының көмегімен қаттылық қай кезде максимал болатынын және қай кезде ең тез өсетінін табу.</p>
<p><b>1. Модель.</b> Үзінді өлшемдері бойынша (0–6 с) функция таңдалды:</p><div class="fx">L(t) = −0,5t³ + 3t² + 50,   0 ≤ t ≤ 6   (L дБ-мен)</div>
<p><b>2. Туынды.</b></p><div class="fx">L′(t) = −1,5t² + 6t = 1,5t·(4 − t)</div>
<p><b>3. Экстремум.</b> L′ = 0 болады t = 0 және t = 4 кезінде. (0; 4) аралығында L′ &gt; 0 (қаттылық өседі, crescendo), (4; 6) аралығында L′ &lt; 0 (кему, diminuendo). t = 4 нүктесінде таңба «+»-тен «−»-ке ауысады, демек максимум:</p><div class="fx">L(4) = −0,5·64 + 3·16 + 50 = 66 дБ</div><div class="sgraph" data-g="7a" data-cap="9-сурет. Қаттылық L(t) = −0,5t³ + 3t² + 50: t = 4 с кезінде максимум 66 дБ."></div><div class="sgraph" data-g="7b" data-cap="10-сурет. L′(t) = −1,5t² + 6t туындысы: t = 4 кезінде нөл (L максимумы), t = 2 кезінде ең үлкен мәні 6 дБ/с."></div>
<p><b>4. Ең тез өсетін</b> жері — L′ ең үлкен болатын жер: L″ = −3t + 6 = 0 ⇒ t = 2 с, жылдамдығы L′(2) = −6 + 12 = 6 дБ/с.</p>
<p><b>5. Қорытынды.</b> Фраза кульминациясы t = 4 с-қа сәйкес келеді: нотада да солай жазылған (3-такт, fortissimo). Басындағы тік өрлеу (6 дБ/с) өткір кіріспедей естіледі, содан кейін шыңға жақындағанда күшею баяулайды.</p>
<p class="muted small"><b>Қосымша:</b> L(t) және L′(t) графиктері. <b>Дереккөздер:</b> оқулық (туындының қолданылуы); ноталар (атауы, тактілер).</p>`,

`<p class="sm-h">СӨЖ № 8. Дыбыстың жалпы энергиясын есептеуге арналған интегралдар</p>
<p><b>Мақсаты:</b> өсіп келе жатқан дыбыс пен тегіс дыбыстың энергиясын салыстыру.</p>
<p><b>1. Модель.</b> Бір нотадағы 3 с ішіндегі crescendo: A(t) = 2t (0-ден 6-ға дейін). Орташа амплитудасы сондай тегіс дыбыс: A = 3 ([0; 3] аралығында 2t-тің орташа мәні 3-ке тең).</p>
<p><b>2. E ~ ∫A² dt есебі:</b></p>
<div class="fx">E₁ = ∫₀³ (2t)² dt = 4·t³/3 |₀³ = 4·27/3 = 36
E₂ = ∫₀³ 3² dt = 9·3 = 27</div><div class="sgraph" data-g="8a" data-cap="11-сурет. [0; 3] аралығында A²(t) = 4t² астындағы аудан (боялған) E₁ = 36 береді; үзік сызық — тегіс дыбыс A² = 9, E₂ = 27."></div>
<p><b>3. Трапеция әдісімен тексеру</b> (n = 6, h = 0,5) E₁ үшін: 0,5·(0/2 + 1 + 4 + 9 + 16 + 25 + 36/2) = 36,5. Қателік 1,4 %; n артқанда қателік азаяды.</p>
<p><b>4. Қорытынды.</b> Орташа амплитуда бірдей болғанда, өсіп келе жатқан дыбыстың энергиясы 33 %-ға көп (36-ға қарсы 27), өйткені амплитуда квадраттан алынады: соңындағы үлкен мәндер «ауырырақ». Музыкант үшін бұл қатты кульминация фраза энергиясының басым бөлігін беретінін білдіреді.</p>
<p class="muted small"><b>Қосымша:</b> боялған ауданы бар график. <b>Дереккөздер:</b> оқулық (анықталған интеграл, Ньютон–Лейбниц формуласы).</p>`,

`<p class="sm-h">СӨЖ № 9. Музыкалық аспаптар құрылымындағы алтын қима</p>
<p><b>Мақсаты:</b> акустикалық гитара пропорцияларының алтын қимаға φ = (1 + √5)/2 ≈ 1,618 қаншалықты жақын екенін тексеру.</p>
<p><b>1. Өлшемдер</b> (сызғыш, дәлдігі 1 мм; үлгі үшін шартты деректер):</p>

<tr><td>Жалпы ұзындық және ұзын бөлік</td><td>1000</td><td>620</td><td>1,613</td><td>−0,3 %</td></tr>
<tr><td>Ұзын және қысқа бөлік</td><td>620</td><td>380</td><td>1,632</td><td>+0,8 %</td></tr>

<p><b>2. Талдау.</b> φ-ге жақын (5 %-дан аз) төрт қатынастың үшеуі. Төртіншісі (корпус) алыс: 17,6 %.</p>
<p><b>3. Тексеру.</b> Перделер алтын қима бойынша орналаспаған: d₁₂ = 650·(1 − 2^(−12/12)) = 325 мм, мензураның дәл жартысы.</p>
<p><b>4. Қорытынды.</b> Кейбір өлшемдер шынымен φ-ге жақын, бірақ өлшенген бірнешеуінің ішіндегі үш сәйкестікті дәлел деп санауға болмайды: өлшемдерді сәйкес келетіндей етіп таңдауға болады. Шебер алтын қиманы қолданған болуы мүмкін, не болмаса «әдемі» пропорцияларды көзбен таңдаған. Қатаң қорытынды үшін көп аспапты өлшеу керек.</p>
<p class="muted small"><b>Қосымша:</b> өлшемдері бар фото, кесте. <b>Дереккөздер:</b> Волошинов А.В. «Математика и искусство»; Васютинский Н.А. «Золотая пропорция».</p>`,

/* ---------- поля ---------- */
function mkField(w,f){
  const id=fid(w,f.id);
  const hint=f.hint?`<div class="hint">${esc(f.hint)}</div>`:'';
  let body;
  if(f.type==='area')body=`<textarea id="${id}" rows="4"></textarea>`;
  else if(f.type==='num')body=`<div class="inl"><input id="${id}" class="num" type="text" inputmode="decimal" autocomplete="off">${f.unit?`<span class="unit">${esc(f.unit)}</span>`:''}</div>`;
  else body=`<input id="${id}" type="text" autocomplete="off">`;
  const d=el(`<div class="fld"><label for="${id}">${esc(f.label)}</label>${body}<div class="fb" aria-live="polite"></div>${hint}</div>`);
  const inp=d.querySelector('input,textarea'),fb=d.querySelector('.fb');
  inp.value=api.val(id);
  const hasAns=f.type==='num'&&f.ans!=null;
  const check=()=>{
    if(!hasAns)return;
    const v=inp.value.trim();inp.classList.remove('ok','bad');fb.className='fb';fb.textContent='';
    if(!v)return;
    const n=pnum(v);
    if(!isFinite(n)){inp.classList.add('bad');fb.className='fb bad';fb.textContent=t('nan');return;}
    if(Math.abs(n-f.ans)<=f.tol){inp.classList.add('ok');fb.className='fb ok';fb.textContent=t('ok');}
    else{inp.classList.add('bad');fb.className='fb bad';fb.textContent=t('bad');
      const b=el(`<button type="button" class="btn sm">${esc(t('show'))}</button>`);
      b.addEventListener('click',()=>{fb.className='fb';fb.textContent=t('ans')+fmt(f.ans,4)+(f.unit?' '+f.unit:'')+t('ansTail');});
      fb.appendChild(b);}
  };
  inp.addEventListener('input',()=>{api.put(id,inp.value);check();});
  check();return d;
}

function drawRosette(cv,n){
  const ctx=cv.getContext('2d');
  const draw=()=>{
    if(!cv.isConnected)return;const r=cv.getBoundingClientRect();if(!r.width)return;
    const d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);
    const W=r.width,H=r.height,R=Math.min(W,H)/2-10,cx=W/2,cy=H/2;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle=cssv('--plot-axis');ctx.setLineDash([5,5]);ctx.lineWidth=1;
    for(let k=0;k<n;k++){const a=Math.PI*k/n;ctx.beginPath();ctx.moveTo(cx-R*1.05*Math.sin(a),cy-R*1.05*Math.cos(a));ctx.lineTo(cx+R*1.05*Math.sin(a),cy+R*1.05*Math.cos(a));ctx.stroke();}
    ctx.setLineDash([]);ctx.strokeStyle=cssv('--plot-a');ctx.fillStyle=cssv('--plot-fill');ctx.lineWidth=2.2;
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
    for(let k=0;k<n;k++){ctx.save();ctx.translate(cx,cy);ctx.rotate(TAU2*k/n);ctx.beginPath();ctx.ellipse(0,-R*.52,R*.17,R*.36,0,0,7);ctx.fill();ctx.stroke();ctx.restore();}
    ctx.fillStyle=cssv('--plot-b');ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();
  };
  if(window.ResizeObserver)new ResizeObserver(draw).observe(cv);draw();
  const mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');if(mq&&mq.addEventListener)mq.addEventListener('change',draw);
}

  <details class="sample" id="passD"><summary>📋 ${esc(t('pT'))}</summary><div class="prose sm" id="passB"></div></details>
  <details class="sample"><summary>📄 ${esc(t('sample'))}</summary><div class="tip warn">${esc(t('sampleNote'))}</div><div class="prose sm">${w.sample||''}</div></details></div>

function buildReport(src,sel,lang){
  const C=CONTENT[lang],U=UI[lang].rep,L=[];
  const av=(w,f)=>((src.a[fid(w,f.id)]||'').trim())||'—';
  const pickW=n=>(src.mode&&src.mode[n]==='B')?C.WORKS_B[n-1]:C.WORKS[n-1];
  const inc=C.WORKS.map(x=>pickW(x.n)).filter(w=>{
    if(sel!=='all')return String(w.n)===sel;
    return w.steps.some(s=>s.fields.some(f=>(src.a[fid(w,f.id)]||'').trim()))||(src.a[fid(w,'concl')]||'').trim()||progressOf(src,w)>0;
  });
  const W=62,ctr=s=>' '.repeat(Math.max(0,Math.floor((W-s.length)/2)))+s,bar='═'.repeat(W);
  const st=src.student,tp=U.tp,blank='______________';
  L.push(bar,'');

  L.push(ctr(tp.doc),'');L.push(ctr(tp.disc),'');
  if(inc.length===1){L.push(ctr(U.srs+inc[0].n),ctr(inc[0].title));}
  else{L.push(ctr(tp.works));inc.forEach(w=>L.push(ctr(U.srs+w.n+'. '+w.short)));}
  L.push('','','');
  L.push('   '+tp.by+(st.name&&st.name.trim()?st.name.trim():blank));
  L.push('   '+U.gr+(st.group&&st.group.trim()?st.group.trim():blank)+'    '+tp.course);
  L.push('   '+tp.check+(st.teacher&&st.teacher.trim()?st.teacher.trim():blank));
  L.push('   '+U.dt+new Date().toLocaleDateString('ru-RU'));
  L.push('',bar);
  const n0=L.length;
  inc.forEach(w=>{
    L.push('');L.push('='.repeat(48));L.push(`${U.srs}${w.n}. ${w.title}`);L.push(`${U.done}${Math.round(progressOf(src,w)*100)} %`);
    if(w.v==='B'){
      const g=id=>((src.a[fid(w,id)]||'').trim())||'—';
      L.push('',U.refTheme+g('theme'));L.push(U.refQ+g('q'));L.push(U.refKw+g('kw'),'');
      const sec=(h,txt)=>{L.push('',h);L.push(txt.replace(/^/gm,'  '));};
      sec(U.refSrcs,'1. '+g('s1')+'\n2. '+g('s2')+'\n3. '+g('s3')+'\n4. '+g('s4'));
      sec(U.refNotes,g('facts')+'\n'+g('terms')+'\n'+g('forms'));
      sec(U.refPlan,g('plan')+'\n'+U.refThesis+g('thesis'));sec(U.refIntro,U.refGoal+g('goal')+'\n'+U.refTasks+g('tasks')+'\n'+g('intro'));
      sec(U.refMain,'1. '+g('p1')+'\n\n2. '+g('p2'));sec(U.refMath,g('math')+'\n'+U.refCheck+g('mcheck'));
      sec(U.refConcl,g('concl'));sec(U.refLit,g('src'));
      sec(U.refApps,'А. '+g('apA')+'\nБ. '+g('apB')+'\nВ. '+g('apC')+'\n'+U.refTool+g('apTool'));
      sec(U.refPres,g('slides')+'\n'+U.refKey+g('key')+'\n'+U.refSpeech+g('speech')+'\n'+U.refTool+g('ptool'));
      sec(U.refDef,'1. '+g('def1')+'\n2. '+g('def2')+'\n3. '+g('def3'));
      C.CHECK_B.forEach((tx,k)=>L.push((src.chk[`${vpre(w)}.c${k+1}`]?'[x] ':'[ ] ')+tx));
      return;
    }
    w.steps.forEach(s=>{
      L.push('');L.push(s.t);
      s.fields.forEach(f=>{
        const a=av(w,f),u=f.type==='num'&&f.unit&&a!=='—'?' '+f.unit:'';
        if(f.type==='area'&&a!=='—')L.push('• '+f.label+'\n    '+a.replace(/\n/g,'\n    '));
        else L.push('• '+f.label+': '+a+u);
      });
    });
    L.push('');L.push(UI[lang].finT);
    L.push('• '+U.concl+((src.a[fid(w,'concl')]||'').trim()||'—'));
    L.push('• '+U.src+((src.a[fid(w,'src')]||'').trim()||'—'));
    C.CHECK.forEach((tx,k)=>L.push((src.chk[`${vpre(w)}.c${k+1}`]?'[x] ':'[ ] ')+tx));
  });
  if(L.length===n0)L.push('',U.empty);
  else{
    const E=U.end,nums=inc.map(w=>w.n);
    const usedApps=SIMS_EXT.slice(0,6).filter((x,k)=>APP_W[k].some(n=>nums.includes(n)));
    const usedMusic=BIB_MUSIC.filter((x,k)=>BIB_MUSIC_W[k].some(n=>nums.includes(n)));
    L.push('',bar,'',ctr(E.t),'');
    L.push(E.main+':');BIB_MAIN.forEach((b,k)=>L.push((k+1)+'. '+b+bibDirect(b)));
    if(usedMusic.length){L.push('',E.add+':');usedMusic.forEach((b,k)=>L.push((BIB_MAIN.length+k+1)+'. '+b+bibDirect(b)));}
    L.push('',E.apps+':');
    L.push('• '+E.wb);usedApps.forEach(x=>L.push('• '+x[0]+' — '+x[1]));

    L.push('• '+E.own);
  }
  return L.join('\n');
}

const DATA_H={ru:{1:['t, с','L, дБ'],6:['t, с','A'],7:['t, с','L, дБ'],8:['t, с','A']},kk:{1:['t, с','L, дБ'],6:['t, с','A'],7:['t, с','L, дБ'],8:['t, с','A']}};
function dataRows(n,lang){
  const raw=(S.a['w'+n+'.data']||'').trim();if(!raw)return null;
  const D=UI[lang].rep.dx;
  if(n===9){const rows=raw.split('\n').map(l=>l.split(';').map(x=>x.trim())).filter(r=>r.length>=2&&r[0]);
    return rows.length?[[D.m1,'a','b']].concat(rows.map(r=>[r[0],r[1]||'',r[2]||''])):null;}
  const h=(DATA_H[lang]||DATA_H.ru)[n];if(!h)return null;
  const pts=parsePts(raw);return pts.length?[['№',h[0],h[1]]].concat(pts.map((q,i)=>[String(i+1),fmt(q[0],3),fmt(q[1],3)])):null;
