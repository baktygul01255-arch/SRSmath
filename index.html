function composeDocx(src,sel,lang){
  const C=CONTENT[lang],U=UI[lang].rep,D=U.dx,Dc=new DX.Doc();
  const st=src.student,blank='______________',tp=U.tp;
  const pickW=n=>(src.mode&&src.mode[n]==='B')?C.WORKS_B[n-1]:C.WORKS[n-1];
  const val=(w,id)=>((src.a[fid(w,id)]||'').trim())||'—';
  const used=w=>w.steps.some(s=>s.fields.some(f=>(src.a[fid(w,f.id)]||'').trim()))||(src.a[fid(w,'concl')]||'').trim()||progressOf(src,w)>0||(SHOTS[w.n]||[]).length;
  const inc=C.WORKS.map(x=>pickW(x.n)).filter(w=>sel==='all'?used(w):String(w.n)===sel);
  const nz=s=>s&&s.trim()?s.trim():blank;
  /* титульный лист */
  Dc.p(st.college&&st.college.trim()?st.college.trim().toUpperCase():tp.college+blank,{align:'center',b:true,before:0,after:2400});
  Dc.p(tp.doc,{align:'center',b:true,sz:32,after:240});
  Dc.p(tp.disc,{align:'center',after:240});
  if(inc.length===1){Dc.p(U.srs+inc[0].n,{align:'center',b:true,after:60});Dc.p(inc[0].title,{align:'center',i:true,after:2400});}
  else{Dc.p(tp.works,{align:'center',after:60});inc.forEach(w=>Dc.p(U.srs+w.n+'. '+w.short,{align:'center',line:276}));Dc.p('',{after:1600});}
  Dc.p(tp.by+nz(st.name),{ind:4400,line:300});
  Dc.p(U.gr+nz(st.group)+'; '+tp.course,{ind:4400,line:300});
  Dc.p(tp.check+nz(st.teacher),{ind:4400,line:300});
  Dc.p(U.dt+new Date().toLocaleDateString('ru-RU'),{ind:4400,line:300,after:1200});
  let fig=0;
  const showShots=(w)=>{
    const list=SHOTS[w.n]||[];if(!list.length)return;
    Dc.h(D.graphs,2);
    list.forEach(sh=>{
      sh.imgs.forEach((im,ix)=>{fig++;Dc.img(im.png,im.w,im.h,15);
        Dc.p(D.fig+' '+fig+' — '+sh.title+(sh.imgs.length>1?' ('+(ix+1)+'/'+sh.imgs.length+')':''),{style:'Caption'});});
      if(sh.params&&sh.params.length){Dc.p(D.params+':',{b:true,sz:24,line:240,after:60,keep:true});Dc.table(sh.params,[5500,3855],{sz:20});}
      if(sh.res&&sh.res.length){Dc.p(D.res+':',{b:true,sz:24,line:240,after:60,keep:true});Dc.table(sh.res,[4300,5055],{sz:20});}
    });
  };
  const showData=(w)=>{const r=dataRows(w.n,lang);if(!r)return;Dc.h(D.data,2);Dc.table(r,r[0].length===3&&w.n===9?[5000,2000,2355]:[1200,4000,4155],{header:true,center:true});};
  inc.forEach(w=>{
    Dc.h(U.srs+w.n+'. '+(w.v==='B'?D.refB+': '+val(w,'theme'):w.title),1,{pb:true});
    if(w.v==='B'){
      const para=(h,txt)=>{Dc.h(h,2);Dc.p(txt,{first:709,align:'both'});};
      para(U.refPlan,val(w,'plan')+'\n'+U.refThesis+val(w,'thesis'));
      para(U.refIntro,U.refQ+val(w,'q')+'\n'+U.refGoal+val(w,'goal')+'\n'+U.refTasks+val(w,'tasks')+'\n'+val(w,'intro'));
      para(U.refMain,'1. '+val(w,'p1')+'\n2. '+val(w,'p2'));
      para(U.refMath,val(w,'math')+'\n'+U.refCheck+val(w,'mcheck'));
      para(U.refConcl,val(w,'concl'));
      para(U.refLit,val(w,'src'));
      Dc.h(U.refApps,2);
      [['А','apA'],['Б','apB'],['В','apC']].forEach(([l,id])=>Dc.p(D.appl+' '+l+'. '+val(w,id),{first:709,align:'both'}));
      Dc.p(U.refTool+val(w,'apTool'),{first:709});
      showData(w);showShots(w);
      para(U.refPres,val(w,'slides')+'\n'+U.refKey+val(w,'key')+'\n'+U.refSpeech+val(w,'speech')+'\n'+U.refTool+val(w,'ptool'));
    }else{
      w.steps.forEach(s=>{
        Dc.h(strip(s.t),2);
        const rows=[[D.q,D.a]].concat(s.fields.map(f=>{const a=val(w,f.id);return [f.label,a+(f.type==='num'&&f.unit&&a!=='—'?' '+f.unit:'')];}));
        Dc.table(rows,[3900,5455],{header:true,sz:22});
      });
      showData(w);showShots(w);
      Dc.h(D.concl,2);Dc.p(val(w,'concl'),{first:709,align:'both'});
      Dc.h(D.src,2);Dc.p(val(w,'src'),{first:709,align:'both'});
    }
  });
  /* литература и приложения */
  const E=U.end,nums=inc.map(w=>w.n);
  const usedApps=SIMS_EXT.slice(0,6).filter((x,k)=>APP_W[k].some(n=>nums.includes(n)));
  const usedMusic=BIB_MUSIC.filter((x,k)=>BIB_MUSIC_W[k].some(n=>nums.includes(n)));
  Dc.h(E.t,1,{pb:true});
  Dc.h(E.main,2);BIB_MAIN.forEach((b,k)=>Dc.p((k+1)+'. '+b+bibDirect(b),{line:276,after:60}));
  if(usedMusic.length){Dc.h(E.add,2);usedMusic.forEach((b,k)=>Dc.p((BIB_MAIN.length+k+1)+'. '+b+bibDirect(b),{line:276,after:60}));}
  Dc.h(E.apps,2);
  Dc.p('• '+E.wb,{line:276,after:60});
  usedApps.forEach(x=>Dc.p('• '+x[0]+' — '+x[1],{line:276,after:60}));
  if(nums.some(n=>PH_W.includes(n))){Dc.p('• '+(lang==='kk'?'Смартфонға арналған қосымшалар:':'Приложения для смартфона:'),{line:276,after:60});PH_APPS.forEach(x=>Dc.p('– '+x[0]+' — '+x[1],{ind:567,line:276,after:40}));}
  Dc.p('• '+E.own,{line:276,after:60});
  return Dc.build(lang);
}
async function copyText(tx){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(tx);return true;}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=tx;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}

  <h2 style="margin-top:28px">${esc(t('resExt'))}</h2>
  <div class="res-g" style="margin-top:12px">${SIMS_EXT.map((x,k)=>`<div class="card"><b>${esc(x[0])}</b><span class="muted small">${esc(t('ext')[k])}</span><a class="btn sm" style="align-self:flex-start" href="${x[1]}" target="_blank" rel="noopener">${esc(t('open'))}</a></div>`).join('')}</div>
  <h2 style="margin-top:28px">${esc(LANG==='kk'?'Смартфонға арналған дыбыс жазу және зерттеу қосымшалары':'Приложения для смартфона: запись и исследование звука')}</h2>
  <p class="muted">${esc(LANG==='kk'?'Қосымшаны смартфонға орнатыңыз, микрофонға рұқсат беріңіз. Жазбаны тыныш бөлмеде, аспапқа жақын жасаңыз. Стандартты «Диктофон» да жарамды.':'Установите приложение на смартфон и разрешите доступ к микрофону. Записывайте в тихой комнате, близко к инструменту. Подойдёт и стандартный «Диктофон».')}</p>
  <div class="res-g" style="margin-top:12px">${PH_APPS.map(x=>`<div class="card"><b>${esc(x[0])}</b><span class="muted small">${esc(x[2][LANG]||x[2].ru)}</span><a class="btn sm" style="align-self:flex-start" href="${x[1]}" target="_blank" rel="noopener">${esc(LANG==='kk'?'Ашу':'Открыть')}</a></div>`).join('')}</div>
  <h2 style="margin-top:28px">${esc(t('bibMain'))}</h2>
  <ol class="bib">${BIB_MAIN.map(b=>`<li>${esc(b)}${bibA(b)}</li>`).join('')}</ol>
  <h2 style="margin-top:28px">${esc(t('bibMusic'))}</h2>
  <ol class="bib" start="${BIB_MAIN.length+1}">${BIB_MUSIC.map((b,k)=>`<li>${esc(b)}${bibA(b)} — ${esc(t('bm')[k])}</li>`).join('')}</ol>
  <div class="tip warn">${esc(t('resWarn'))}</div>`);
}

/* ---------- кабинет преподавателя ---------- */
async function renderTeacher(){
  const w=mount(topbar('teacher')+`<section class="hero"><h1>${esc(t('tH1'))}</h1></section><div id="tSet"></div><div id="tBody" class="muted">${esc(t('tLoading'))}</div>`);
  await roleP;
  const box=$('#tBody',w);if(!box||!box.isConnected)return;
  const db=await getDb();const local=!db;
  if(!ROLE.teacher&&!local){box.textContent=t('tOnly');return;}
  let rows=[],grades={},dirty=false,gF='',q='',openId=null,selW='all';
  if(local){rows=lget(LKEY_R,[]);grades=lget(LKEY_G,{});}
  const saveGrades=async(id,cur)=>{if(db)await db.doc('grades/'+id).set(cur);else{grades[id]=cur;lset(LKEY_G,grades);}};
  function buildImport(){
    const host=$('#tSet',w);if(!host)return;
    host.innerHTML=`<div class="card" style="margin-bottom:14px"><label for="tFiles"><b>${esc(t('tImport'))}</b></label><div class="row" style="margin-top:8px"><input id="tFiles" type="file" accept=".json,application/json" multiple style="width:auto;max-width:100%"><button type="button" class="btn sm danger" id="tClr">${esc(t('tClear'))}</button></div><p class="muted small" style="margin:8px 0 0">${esc(t('tImportNote'))}</p></div>`;
    $('#tFiles',host).addEventListener('change',async e=>{
      let n=0,bad=0;
      for(const f of Array.from(e.target.files)){
        try{const d=JSON.parse(await f.text());if(!d||typeof d.name!=='string'||typeof d.data!=='string')throw 0;
          const id=(d.name.trim()+'|'+(d.group||'').trim()).toLowerCase();const k=rows.findIndex(x=>x.id===id);
          if(k>=0&&(rows[k].updated||'')>=(d.updated||'')){n++;continue;}
          const row=Object.assign({},d,{id});if(k>=0)rows[k]=row;else rows.push(row);n++;}catch(err){bad++;}
      }
      rows.sort((a,b)=>((a.group||'')+(a.name||'')).localeCompare((b.group||'')+(b.name||''),'ru'));
      lset(LKEY_R,rows);e.target.value='';draw();toast(bad?t('tImportBad'):t('tImported')(n));
    });
    $('#tClr',host).addEventListener('click',()=>{rows=[];grades={};lset(LKEY_R,[]);lset(LKEY_G,{});openId=null;draw();});
  }
  const shortD=iso=>{try{return new Date(iso).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});}catch(e){return '';}};
  const cell=(r,n)=>{const s=r.submitted&&r.submitted[n],p=r.prog&&r.prog[n];
    const gr=grades[r.id]&&grades[r.id]['w'+n];
    const bb=r.mode&&r.mode[n]==='B'?' <b title="'+esc(t('varB'))+'">Б</b>':'';
    if(s)return `<td class="ok">✓ ${esc(shortD(s))}${bb}${gr?`<br><b>${gr.total}</b>`:''}</td>`;
    if(p>0)return `<td>${Math.round(p*100)} %${bb}</td>`;return '<td class="muted">—</td>';};
  async function buildSettings(){
    const host=$('#tSet',w);if(!host)return;const c=await getCfg();
    host.innerHTML=`<details class="sample" style="margin-bottom:14px"><summary>⚙ ${esc(t('tSetT'))}</summary><div style="padding:12px 14px"><div class="tblw"><table class="tbl"><thead><tr><th>${esc(t('srs'))}</th><th>${esc(t('tSetDate'))}</th><th>${esc(t('tSetNote'))}</th></tr></thead><tbody>${WORKS.map(x=>`<tr><td><b>${x.n}</b> ${esc(x.short)}</td><td><input type="date" data-d="${x.n}" value="${esc((c.deadlines&&c.deadlines[x.n])||'')}" style="width:auto"></td><td style="white-space:normal;min-width:220px"><input type="text" data-n="${x.n}" value="${esc((c.notes&&c.notes[x.n])||'')}"></td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:10px"><button type="button" class="btn primary" id="tSetSave">${esc(t('tSave'))}</button></div></div></details>`;
    $('#tSetSave',host).addEventListener('click',async()=>{
      const deadlines={},notes={};$$('input[data-d]',host).forEach(i=>{if(i.value)deadlines[i.dataset.d]=i.value;});$$('input[data-n]',host).forEach(i=>{if(i.value.trim())notes[i.dataset.n]=i.value.trim();});
      try{await db.doc('config/main').set({deadlines,notes,updated:new Date().toISOString()});CFGP=Promise.resolve({deadlines,notes});toast(t('tSaved'));}catch(e){toast(t('tGradeFail'));}
    });
  }
  function draw(){
    const groups=[...new Set(rows.map(r=>r.group||'').filter(Boolean))].sort();
    const vis=rows.filter(r=>(!gF||r.group===gF)&&(!q||(r.name||'').toLowerCase().includes(q.toLowerCase())));
    const subCount=vis.reduce((s,r)=>s+Object.keys(r.submitted||{}).length,0);
    if(!rows.length){box.className='';box.innerHTML=`<div class="tip">${esc(t(local?'tEmptyL':'tEmpty'))}</div>`;return;}
    box.className='';
    box.innerHTML=`<div class="row" style="margin-bottom:12px">
      <select id="tG" style="width:auto"><option value="">${esc(t('tAllGr'))}</option>${groups.map(g=>`<option ${g===gF?'selected':''}>${esc(g)}</option>`).join('')}</select>
      <input id="tQ" type="text" placeholder="${esc(t('tSearch'))}" value="${esc(q)}" style="width:auto;flex:1 1 180px">
      <button type="button" class="btn sm" id="tCsv" style="display:none">${esc(t('tCsv'))}</button></div>
      <p class="muted small">${esc(t('tCount')(vis.length,subCount))}<br>${esc(t('tLegend'))}</p>
      <div class="tblw"><table class="tbl tt2"><thead><tr><th>${esc(t('tStudent'))}</th>${WORKS.map(x=>`<th title="${esc(x.title)}">${x.n}</th>`).join('')}<th>${esc(t('tUpd'))}</th></tr></thead>
      <tbody>${vis.map(r=>`<tr class="clk ${r.id===openId?'cur':''}" data-id="${esc(r.id)}"><td><b>${esc(r.name||'—')}</b><br><span class="muted small">${esc(r.group||'')}</span></td>${WORKS.map(x=>cell(r,x.n)).join('')}<td class="muted small">${esc(r.updated?new Date(r.updated).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')}</td></tr>`).join('')}</tbody></table></div>
      <div id="tDet"></div>`;
    $('#tG',box).addEventListener('change',e=>{gF=e.target.value;draw();});
    const qi=$('#tQ',box);qi.addEventListener('input',e=>{q=e.target.value;const pos=e.target.selectionStart;draw();const n=$('#tQ',box);n.focus();n.setSelectionRange(pos,pos);});
    $$('tr.clk',box).forEach(tr=>tr.addEventListener('click',()=>{openId=tr.dataset.id===openId?null:tr.dataset.id;dirty=false;draw();if(openId)$('#tDet',box).scrollIntoView({block:'nearest'});}));
    const cb=$('#tCsv',box);cb.style.display='';cb.onclick=async()=>{
      const head=UI.ru.tCols.split(',').concat(WORKS.map(x=>'СРС'+x.n));
      const q2=v=>'"'+String(v).replace(/"/g,'""')+'"';
      const lines=[head.map(q2).join(',')].concat(vis.map(r=>[r.name||'',r.group||'',r.updated||''].concat(WORKS.map(x=>{const g=grades[r.id]&&grades[r.id]['w'+x.n];return r.submitted&&r.submitted[x.n]?'сдано '+r.submitted[x.n].slice(0,10)+(g?'; '+g.total+'/100':''):(r.prog&&r.prog[x.n]>0?Math.round(r.prog[x.n]*100)+'%':'');})).map(q2).join(',')));
      try{await saveFile('SRS_sdacha.csv','\uFEFF'+lines.join('\n'),'text/csv;charset=utf-8');toast(t('tCsvSaved'));}catch(e){}};
    const r=rows.find(x=>x.id===openId);
    if(r){
      let dat={a:{},done:{},chk:{}};try{dat=JSON.parse(r.data||'{}');}catch(e){}
      const rMode=Object.assign({},r.mode||{},dat.mode||{});
      const src={student:{name:r.name,group:r.group,college:r.college,teacher:r.teacher},a:dat.a||{},done:dat.done||{},chk:dat.chk||{},mode:rMode};
      const det=$('#tDet',box);
      det.innerHTML=`<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3>${esc(r.name||'')} · ${esc(r.group||'')}</h3><button type="button" class="btn sm" id="tX">${esc(t('tClose'))}</button></div>
        <div class="row" style="margin:10px 0"><label class="small muted" for="tW">${esc(t('tPick'))}</label><select id="tW" style="width:auto">${['all'].concat(WORKS.map(x=>String(x.n))).map(v=>`<option value="${v}" ${v===selW?'selected':''}>${v==='all'?esc(UI.ru.rAll):'СРС № '+v+'. '+esc(CONTENT.ru.WORKS[v-1].short)}</option>`).join('')}</select>
        <button type="button" class="btn sm" id="tC">${esc(t('tCopy'))}</button></div><pre class="rep" id="tP"></pre><div id="gForm" style="margin-top:14px"></div></div>`;
      const pre=$('#tP',det);const up=()=>{pre.textContent=buildReport(src,selW,'ru');};up();
      const gf=$('#gForm',det);
      const buildG=()=>{
        if(selW==='all'){gf.innerHTML=`<p class="muted small">${esc(t('tGradePick'))}</p>`;return;}
        const old=(grades[r.id]&&grades[r.id]['w'+selW])||{c:[],comment:''};
        gf.innerHTML=`<h3 style="margin-bottom:8px">${esc(t('tGradeT'))}: ${esc(t('srs'))} ${selW}</h3><div class="tblw"><table class="tbl"><tbody>${(rMode[selW]==='B'?RUB_B:RUB).map((c,i)=>`<tr><td style="white-space:normal"><b>${esc(c.t)}</b><div class="small muted">${c.d.map((x,k)=>{const b=bandsOf(c)[k];return b[0]+'–'+b[1]+' — '+esc(x);}).join('<br>')}</div></td><td><input type="number" data-i="${i}" min="0" max="${c.max}" step="1" value="${old.c[i]!=null?old.c[i]:''}" style="width:78px" inputmode="numeric"> / ${c.max}</td></tr>`).join('')}</tbody></table></div>
        <div class="fld" style="margin-top:8px"><label for="gC">${esc(t('gComment'))}</label><textarea id="gC" rows="2">${esc(old.comment||'')}</textarea></div>
        <div class="row" style="margin-top:8px"><button type="button" class="btn primary" id="gSave">${esc(t('tGradeSave'))}</button><b id="gTot"></b></div>`;
        const val=x=>{let v=Math.round(+x.value||0);return Math.max(0,Math.min(+x.max,v));};
        const tot=()=>{let s=0;$$('input[data-i]',gf).forEach(x=>{s+=val(x);});$('#gTot',gf).textContent=t('gTotal')+': '+s+'/100 ('+letterOf(s)+')';return s;};
        tot();$$('input[data-i]',gf).forEach(x=>x.addEventListener('input',()=>{dirty=true;tot();}));$('#gC',gf).addEventListener('input',()=>{dirty=true;});
        $('#gSave',gf).addEventListener('click',async()=>{
          const c=$$('input[data-i]',gf).map(val),total=c.reduce((a,b)=>a+b,0);
          try{const cur=Object.assign({},grades[r.id]||{});cur['w'+selW]={c,total,comment:$('#gC',gf).value.trim(),at:new Date().toISOString()};await saveGrades(r.id,cur);dirty=false;if(local)draw();toast(t('tGradeSaved'));}catch(e){toast(t('tGradeFail'));}
        });
      };
      buildG();
      $('#tW',det).addEventListener('change',e=>{selW=e.target.value;up();buildG();});
      $('#tC',det).addEventListener('click',async()=>{toast(await copyText(pre.textContent)?t('copied'):t('copyFail'));});
      $('#tX',det).addEventListener('click',()=>{openId=null;dirty=false;draw();});
    }
  }
  draw();if(local)buildImport();else buildSettings();
  if(local)return;
  const u1=db.collection('submissions').onSnapshot(snap=>{rows=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>((a.group||'')+(a.name||'')).localeCompare((b.group||'')+(b.name||''),'ru'));if(!dirty)draw();},
    e=>{box.className='tip warn';box.textContent=t('tErr')+(e&&e.message||'');});
  const u2=db.collection('grades').onSnapshot(snap=>{grades={};snap.docs.forEach(d=>{grades[d.id]=d.data();});if(!dirty)draw();},()=>{});
  unsub=()=>{u1();u2();};
}

/* ---------- маршрутизатор ---------- */
function route(){
  Snd.stop();GRP=null;CFGP=null;
  const h=(location.hash||'').replace('#','');
  const m=/^w(\d+)$/.exec(h);
  if(m&&WN(+m[1]))renderWork(+m[1]);
  else if(h==='report')renderReport();
  else if(h==='resources')renderRes();
  else if(h==='teacher')renderTeacher();
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
